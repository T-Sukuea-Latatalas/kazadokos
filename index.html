<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAZADOK</title>
  <style>
    @font-face {
      font-family: 'NotoSansKazadok';
      src: url('./Noto_Sans_Kazadok.otf') format('opentype');
      font-display: swap;
    }

    :root {
      --bg: #ffffff;
      --text: #000000;
      --border: #000000;
      --line: #e5e5e5;
      --sub: #888888;
      --detail-bg: #fafafa;
      --sticky-offset: 72px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding: 40px;
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 30px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    h1 {
      font-size: 1.1rem;
      letter-spacing: 0.25em;
      font-weight: 700;
      text-transform: uppercase;
    }

    .count {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      color: var(--sub);
      text-transform: uppercase;
    }

    /* 画面上部固定バー */
    .sticky-bar {
      position: sticky;
      top: 0;
      background-color: var(--bg);
      z-index: 100;
      padding-top: 10px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .search-box {
      flex: 1;
    }

    .search-box input {
      width: 100%;
      background: transparent;
      border: none;
      padding: 8px 0;
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
      letter-spacing: 0.05em;
    }

    .search-box input::placeholder {
      color: var(--sub);
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      padding: 8px 14px;
      cursor: pointer;
      font-weight: 600;
      outline: none;
      transition: background-color 0.1s, color 0.1s;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .btn:hover {
      background: var(--text);
      color: var(--bg);
    }

    /* テーブルコンテナ */
    .table-container {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      table-layout: fixed;
    }

    th {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 600;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--sub);
      user-select: none;
      transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease, padding 0.3s ease;
    }

    th.sortable {
      cursor: pointer;
      transition: color 0.15s ease;
    }

    th.sortable:hover {
      color: var(--text);
    }

    th.sortable.asc::after {
      content: ' ↑';
      color: var(--text);
    }

    th.sortable.desc::after {
      content: ' ↓';
      color: var(--text);
    }

    /* 列幅の制御（拡大前: 4列） */
    .col-word { width: 26%; }
    .col-pos  { width: 14%; }
    .col-pron { width: 24%; }
    .col-mean { width: 36%; }
    .col-detail {
      width: 0%;
      padding: 0;
      opacity: 0;
      overflow: hidden;
      border-bottom-color: transparent;
    }

    /* 拡大時（5列にスムーズ移行） */
    table.has-expanded .col-word { width: 20%; }
    table.has-expanded .col-pos  { width: 12%; }
    table.has-expanded .col-pron { width: 18%; }
    table.has-expanded .col-mean { width: 25%; }
    table.has-expanded .col-detail {
      width: 25%;
      padding: 12px 14px;
      opacity: 1;
      border-bottom-color: var(--border);
    }

    td {
      padding: 16px 14px;
      font-size: 0.95rem;
      transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.15s ease;
    }

    /* 単語データ行 */
    tr.word-row {
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    tr.word-row:hover,
    tr.word-row.hovered {
      background-color: #f9f9f9;
    }

    tr.word-row.expanded,
    tr.word-row.expanded:hover {
      background-color: #f6f6f6;
    }

    /* 単語全体の上下中央揃え */
    td.col-word {
      font-family: 'NotoSansKazadok', sans-serif;
      font-size: 1.4rem;
      letter-spacing: 0.05em;
      white-space: nowrap;
      vertical-align: middle; /* 枠内で縦中央 */
    }

    /* 発音欄の上下中央揃え */
    td.col-pron {
      font-family: "Lucida Console", Monaco, monospace;
      font-size: 0.85rem;
      letter-spacing: 0.02em;
      line-height: 1.6;
      vertical-align: middle; /* 2つ目以降空欄のため枠内で縦中央 */
    }

    /* 品詞・意味・ニュアンスの垂直位置 */
    td.col-pos {
      vertical-align: top;
      line-height: 1.6;
    }

    td.col-mean {
      vertical-align: top;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    /* 1つしか意味がない行は全体を上下中央揃え */
    tr.word-row.single-sense td {
      vertical-align: middle !important;
    }

    /* 単語の最終行の区切り線 */
    tr.word-row.last-sub-row td {
      border-bottom: 1px solid var(--line);
    }

    /* 枠内で異なる品詞間の横線区切り */
    tr.word-row.pos-divider td.col-pos,
    tr.word-row.pos-divider td.col-mean,
    tr.word-row.pos-divider td.col-detail {
      border-top: 1px solid var(--line);
    }

    /* 品詞スクロール追従（Sticky）表示 */
    .sticky-pos {
      position: sticky;
      top: var(--sticky-offset);
      display: inline-block;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
    }

    /* ニュアンス列（詳細展開セル） */
    td.col-detail {
      vertical-align: top;
      padding: 0;
      overflow: hidden;
      background-color: transparent;
    }

    tr.word-row.expanded td.col-detail {
      padding: 16px 14px;
    }

    /* ニュアンス表示用アニメーションラッパー */
    .detail-wrapper {
      max-width: 0;
      opacity: 0;
      transform: translateX(-8px);
      transition: max-width 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.25s ease,
                  transform 0.25s ease;
      overflow: hidden;
      white-space: pre-wrap;
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--text);
    }

    tr.word-row.expanded .detail-wrapper {
      max-width: 600px;
      opacity: 1;
      transform: translateX(0);
    }

    .detail-empty {
      color: var(--sub);
      font-style: italic;
    }

    .state {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 40px 0;
      color: var(--sub);
    }

    @media (max-width: 768px) {
      :root {
        --sticky-offset: 108px;
      }
      body {
        padding: 30px 16px;
      }
      .sticky-bar {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
        padding-bottom: 14px;
      }
      .actions {
        justify-content: flex-end;
      }
      th, td {
        padding: 12px 8px;
      }
      .col-word {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Kazadok</h1>
    <span id="count" class="count"></span>
  </header>

  <div class="sticky-bar">
    <div class="search-box">
      <input type="text" id="filter" placeholder="Search" autocomplete="off">
    </div>
    <div class="actions">
      <button type="button" id="btn-open-all" class="btn">Open All</button>
      <button type="button" id="btn-close-all" class="btn">Close All</button>
    </div>
  </div>

  <div id="state" class="state">Loading</div>

  <div class="table-container">
    <table id="table" style="display: none;">
      <thead>
        <tr>
          <th class="col-word">Boli</th>
          <th class="col-pos sortable" id="th-pos">Class</th>
          <th class="col-pron">Pronunciation</th>
          <th class="col-mean">Meaning</th>
          <th class="col-detail">Detail</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRThahRna9pyj-I9FmmH9sF8jye4uDOuGSK63Ti3KYI9NDcFds8hiASgM8ach7ybrlWjlr8H217wZwC/pub?gid=808368291&single=true&output=csv';

    function convertKazadok(str) {
      if (!str) return '';
      return str
        .replace(/\^/g, '\u0304')
        .replace(/´/g, '');
    }

    function restorePhonemes(str) {
      if (!str) return '';
      return str
        .replace(/q/g, 'ts')
        .replace(/Q/g, 'TS')
        .replace(/r/g, 'sh')
        .replace(/R/g, 'SH')
        .replace(/v/g, 'ly')
        .replace(/V/g, 'LY')
        .replace(/´/g, '');
    }

    function normalizeQuery(str) {
      if (!str) return '';
      return str.toLowerCase()
        .replace(/-/g, '^')
        .replace(/\u0304/g, '^')
        .replace(/´/g, '');
    }

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let val = '';
      let quote = false;

      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const next = text[i + 1];

        if (c === '"' && quote && next === '"') {
          val += '"';
          i++;
        } else if (c === '"') {
          quote = !quote;
        } else if (c === ',' && !quote) {
          row.push(val.trim());
          val = '';
        } else if ((c === '\r' || c === '\n') && !quote) {
          if (c === '\r' && next === '\n') i++;
          row.push(val.trim());
          if (row.some(item => item !== '')) rows.push(row);
          row = [];
          val = '';
        } else {
          val += c;
        }
      }
      if (val || row.length > 0) {
        row.push(val.trim());
        if (row.some(item => item !== '')) rows.push(row);
      }
      return rows;
    }

    async function fetchCSVWithFallback(url) {
      const target = url + (url.includes('?') ? '&' : '?') + '_ts=' + Date.now();
      
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 4000);
        const res = await fetch(target, { signal: controller.signal });
        clearTimeout(timeoutId);
        if (res.ok) {
          return await res.text();
        }
      } catch (err) {
        console.warn('Direct fetch blocked by CORS or timed out. Trying proxy fallback...');
      }

      const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(target);
      const proxyRes = await fetch(proxyUrl);
      if (!proxyRes.ok) throw new Error('Proxy fetch failed');
      return await proxyRes.text();
    }

    let records = [];
    let sortState = 'none';

    async function init() {
      const stateEl = document.getElementById('state');
      const tableEl = document.getElementById('table');

      try {
        const csvText = await fetchCSVWithFallback(CSV_URL);
        const rows = parseCSV(csvText);

        const dataRows = (rows.length > 0 && (rows[0][0] === '単語' || rows[0][1] === '品詞' || rows[0][0] === 'Boli'))
          ? rows.slice(1)
          : rows;

        const groupedMap = new Map();

        dataRows.forEach(r => {
          const raw = (r[0] || '').trim();
          if (!raw) return;

          const sense = {
            pos: (r[1] || '').trim(),
            pron: (r[2] || '').trim(),
            mean: (r[3] || '').trim(),
            detail: (r[5] || '').trim()
          };

          if (!groupedMap.has(raw)) {
            groupedMap.set(raw, {
              id: groupedMap.size,
              raw: raw,
              word: convertKazadok(raw),
              restoredWord: normalizeQuery(restorePhonemes(raw)),
              senses: [sense]
            });
          } else {
            groupedMap.get(raw).senses.push(sense);
          }
        });

        groupedMap.forEach(item => {
          const fallbackPron = item.senses.find(s => s.pron)?.pron || '';
          item.mainPron = fallbackPron;

          item.senses.forEach(s => {
            if (!s.pron) s.pron = fallbackPron;
          });

          // 同じ品詞をまとめてグループ化
          const posMap = new Map();
          item.senses.forEach(s => {
            const posKey = s.pos || '—';
            if (!posMap.has(posKey)) {
              posMap.set(posKey, []);
            }
            posMap.get(posKey).push(s);
          });

          item.posGroups = Array.from(posMap.entries()).map(([pos, senses]) => ({
            pos: pos === '—' ? '' : pos,
            senses: senses
          }));
        });

        records = Array.from(groupedMap.values());

        applyView();
        stateEl.style.display = 'none';
        tableEl.style.display = 'table';
      } catch (e) {
        console.error(e);
        stateEl.textContent = 'Error: Failed to load data.';
      }
    }

    function applyView() {
      const rawInput = document.getElementById('filter').value.trim();
      const qNorm = normalizeQuery(rawInput);
      const qLower = rawInput.toLowerCase();

      let list = !rawInput ? [...records] : records.filter(item => {
        if (item.restoredWord.includes(qNorm)) return true;
        return item.senses.some(s =>
          s.pos.toLowerCase().includes(qLower) ||
          s.pron.toLowerCase().includes(qLower) ||
          s.mean.toLowerCase().includes(qLower) ||
          s.detail.toLowerCase().includes(qLower)
        );
      });

      if (sortState === 'asc') {
        list.sort((a, b) => {
          const posA = a.posGroups[0]?.pos || '';
          const posB = b.posGroups[0]?.pos || '';
          return posA.localeCompare(posB, 'ja') || a.id - b.id;
        });
      } else if (sortState === 'desc') {
        list.sort((a, b) => {
          const posA = a.posGroups[0]?.pos || '';
          const posB = b.posGroups[0]?.pos || '';
          return posB.localeCompare(posA, 'ja') || a.id - b.id;
        });
      } else {
        list.sort((a, b) => a.id - b.id);
      }

      render(list);
    }

    function render(list) {
      const tbody = document.getElementById('tbody');
      const table = document.getElementById('table');
      const countEl = document.getElementById('count');
      tbody.innerHTML = '';
      countEl.textContent = `${list.length} BOLI`;

      const frag = document.createDocumentFragment();

      list.forEach(item => {
        const totalSenses = item.senses.length;
        const totalGroups = item.posGroups.length;
        const isSingleSense = totalSenses === 1;

        const wordRows = [];

        item.posGroups.forEach((group, gIndex) => {
          const tr = document.createElement('tr');
          tr.className = `word-row ${isSingleSense ? 'single-sense' : 'multi-sense'}`;
          tr.dataset.wordId = item.id;

          if (gIndex > 0) {
            tr.classList.add('pos-divider'); // 枠内の異なる品詞間に横線
          }
          if (gIndex === totalGroups - 1) {
            tr.classList.add('last-sub-row');
          }

          // [単語]（Boli）: rowspanで結合し、枠内で上下中央揃え
          if (gIndex === 0) {
            const tdWord = document.createElement('td');
            tdWord.className = 'col-word';
            tdWord.textContent = item.word;
            tdWord.title = item.raw;
            if (totalGroups > 1) tdWord.rowSpan = totalGroups;
            tr.appendChild(tdWord);
          }

          // [品詞]（Class）
          const tdPos = document.createElement('td');
          tdPos.className = 'col-pos';
          const stickyPos = document.createElement('div');
          stickyPos.className = 'sticky-pos';
          stickyPos.textContent = group.pos;
          tdPos.appendChild(stickyPos);
          tr.appendChild(tdPos);

          // [発音]（Pronunciation）: rowspanで結合し、枠内で上下中央揃え
          if (gIndex === 0) {
            const tdPron = document.createElement('td');
            tdPron.className = 'col-pron';
            tdPron.textContent = item.mainPron;
            if (totalGroups > 1) tdPron.rowSpan = totalGroups;
            tr.appendChild(tdPron);
          }

          // [意味]（Meaning）
          const tdMean = document.createElement('td');
          tdMean.className = 'col-mean';
          if (group.senses.length === 1) {
            tdMean.textContent = group.senses[0].mean;
          } else {
            tdMean.textContent = group.senses
              .map((s, idx) => `${idx + 1}. ${s.mean}`)
              .join('\n');
          }
          tr.appendChild(tdMean);

          // [ニュアンス]（Detail / Nuance）: 各意味の真横に対応して配置
          const tdDetail = document.createElement('td');
          tdDetail.className = 'col-detail';

          const detailWrapper = document.createElement('div');
          detailWrapper.className = 'detail-wrapper';

          if (group.senses.length === 1) {
            const detailText = group.senses[0].detail.trim();
            detailWrapper.textContent = detailText || '-';
            if (!detailText) detailWrapper.className += ' detail-empty';
          } else {
            detailWrapper.textContent = group.senses
              .map((s, idx) => `${idx + 1}. ${s.detail.trim() || '-'}`)
              .join('\n');
          }

          tdDetail.appendChild(detailWrapper);
          tr.appendChild(tdDetail);

          wordRows.push(tr);
          frag.appendChild(tr);
        });

        // 単語枠の拡大・縮小トグル処理
        const toggleWord = () => {
          const isExpanded = wordRows[0].classList.contains('expanded');
          wordRows.forEach(r => r.classList.toggle('expanded', !isExpanded));

          // 1つでも開いている行があればテーブル全体にhas-expandedを付与
          const anyExpanded = tbody.querySelectorAll('tr.word-row.expanded').length > 0;
          table.classList.toggle('has-expanded', anyExpanded);
        };

        wordRows.forEach(r => {
          r.addEventListener('click', toggleWord);
          r.addEventListener('mouseenter', () => wordRows.forEach(row => row.classList.add('hovered')));
          r.addEventListener('mouseleave', () => wordRows.forEach(row => row.classList.remove('hovered')));
        });
      });

      tbody.appendChild(frag);
    }

    // 全開
    document.getElementById('btn-open-all').addEventListener('click', () => {
      document.querySelectorAll('tr.word-row').forEach(tr => tr.classList.add('expanded'));
      document.getElementById('table').classList.add('has-expanded');
    });

    // 全閉
    document.getElementById('btn-close-all').addEventListener('click', () => {
      document.querySelectorAll('tr.word-row').forEach(tr => tr.classList.remove('expanded'));
      document.getElementById('table').classList.remove('has-expanded');
    });

    // 品詞ソート
    const thPos = document.getElementById('th-pos');
    thPos.addEventListener('click', () => {
      if (sortState === 'none') {
        sortState = 'asc';
        thPos.className = 'col-pos sortable asc';
      } else if (sortState === 'asc') {
        sortState = 'desc';
        thPos.className = 'col-pos sortable desc';
      } else {
        sortState = 'none';
        thPos.className = 'col-pos sortable';
      }
      applyView();
    });

    document.getElementById('filter').addEventListener('input', applyView);

    init();
  </script>
</body>
</html>
