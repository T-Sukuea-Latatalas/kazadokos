<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAZADOK</title>
  <style>
    @font-face {
      font-family: 'NotoSansKazadok';
      src: url('./Noto_Sans_Kazadok.otf') format('opentype');
      font-display: swap;
    }

    :root {
      --bg: #ffffff;
      --text: #000000;
      --border: #000000;
      --line: #e5e5e5;
      --sub: #888888;
      --detail-bg: #fafafa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding: 40px;
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 30px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    h1 {
      font-size: 1.1rem;
      letter-spacing: 0.25em;
      font-weight: 700;
      text-transform: uppercase;
    }

    .count {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      color: var(--sub);
      text-transform: uppercase;
    }

    /* 画面上部固定コントロールバー */
    .sticky-bar {
      position: sticky;
      top: 0;
      background-color: var(--bg);
      z-index: 100;
      padding-top: 10px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .search-box {
      flex: 1;
    }

    .search-box input {
      width: 100%;
      background: transparent;
      border: none;
      padding: 8px 0;
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
      letter-spacing: 0.05em;
    }

    .search-box input::placeholder {
      color: var(--sub);
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      padding: 8px 14px;
      cursor: pointer;
      font-weight: 600;
      outline: none;
      transition: background-color 0.1s, color 0.1s;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .btn:hover {
      background: var(--text);
      color: var(--bg);
    }

    /* テーブル */
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 600;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--sub);
      user-select: none;
    }

    th.sortable {
      cursor: pointer;
      transition: color 0.15s ease;
    }

    th.sortable:hover {
      color: var(--text);
    }

    th.sortable.asc::after {
      content: ' ↑';
      color: var(--text);
    }

    th.sortable.desc::after {
      content: ' ↓';
      color: var(--text);
    }

    td {
      padding: 16px 14px;
      vertical-align: top;
      font-size: 0.95rem;
    }

    tr.word-row {
      cursor: pointer;
      border-bottom: 1px solid var(--line);
      transition: background-color 0.15s ease;
    }

    tr.word-row:hover {
      background-color: #f9f9f9;
    }

    tr.word-row.expanded {
      background-color: #f2f2f2;
      border-bottom-color: transparent;
    }

    /* 詳細展開行 */
    tr.detail-row td {
      padding: 0;
      border-bottom: 1px solid var(--line);
      background-color: var(--detail-bg);
      cursor: pointer;
    }

    tr.detail-row.expanded td {
      border-bottom: 1px solid var(--border);
    }

    /* アコーディオンアニメーション用ラッパー */
    .detail-wrapper {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    tr.detail-row.expanded .detail-wrapper {
      grid-template-rows: 1fr;
    }

    .detail-inner {
      overflow: hidden;
    }

    .detail-content {
      padding: 20px 14px 24px 14px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .detail-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .detail-item:not(:last-child) {
      padding-bottom: 12px;
      border-bottom: 1px solid #ececec;
    }

    .detail-sub-heading {
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--sub);
    }

    .detail-body {
      font-size: 0.9rem;
      line-height: 1.7;
      color: var(--text);
      white-space: pre-wrap;
    }

    .detail-empty {
      font-size: 0.85rem;
      color: var(--sub);
      font-style: italic;
    }

    .col-word {
      font-family: 'NotoSansKazadok', sans-serif;
      font-size: 1.4rem;
      letter-spacing: 0.05em;
      white-space: nowrap;
      width: 28%;
    }

    .col-pos {
      width: 14%;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    .col-pron {
      width: 24%;
      font-family: "Lucida Console", Monaco, monospace;
      font-size: 0.85rem;
      letter-spacing: 0.02em;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    .col-mean {
      width: 34%;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    .state {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 40px 0;
      color: var(--sub);
    }

    @media (max-width: 768px) {
      body {
        padding: 30px 16px;
      }
      .sticky-bar {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
        padding-bottom: 14px;
      }
      .actions {
        justify-content: flex-end;
      }
      th, td {
        padding: 12px 8px;
      }
      .col-word {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Kazadok</h1>
    <span id="count" class="count"></span>
  </header>

  <div class="sticky-bar">
    <div class="search-box">
      <input type="text" id="filter" placeholder="Search" autocomplete="off">
    </div>
    <div class="actions">
      <button type="button" id="btn-open-all" class="btn">Open All</button>
      <button type="button" id="btn-close-all" class="btn">Close All</button>
    </div>
  </div>

  <div id="state" class="state">Loading</div>

  <table id="table" style="display: none;">
    <thead>
      <tr>
        <th class="col-word">Boli</th>
        <th class="col-pos sortable" id="th-pos">Class</th>
        <th class="col-pron">Pronunciation</th>
        <th class="col-mean">Meaning</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRThahRna9pyj-I9FmmH9sF8jye4uDOuGSK63Ti3KYI9NDcFds8hiASgM8ach7ybrlWjlr8H217wZwC/pub?gid=808368291&single=true&output=csv';

    // A列用 置換処理（^ -> ̄、´ -> 消去 のみ）
    function convertKazadok(str) {
      if (!str) return '';
      return str
        .replace(/\^/g, '\u0304')
        .replace(/´/g, '');
    }

    // 検索用: A列のq, r, vを本来の発音(ts, sh, ly)に復元
    function restorePhonemes(str) {
      if (!str) return '';
      return str
        .replace(/q/g, 'ts')
        .replace(/Q/g, 'TS')
        .replace(/r/g, 'sh')
        .replace(/R/g, 'SH')
        .replace(/v/g, 'ly')
        .replace(/V/g, 'LY')
        .replace(/´/g, '');
    }

    // 検索語句正規化（長音記号のゆらぎ吸収）
    function normalizeQuery(str) {
      if (!str) return '';
      return str.toLowerCase()
        .replace(/-/g, '^')
        .replace(/\u0304/g, '^')
        .replace(/´/g, '');
    }

    // CSVパーサー
    function parseCSV(text) {
      const rows = [];
      let row = [];
      let val = '';
      let quote = false;

      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const next = text[i + 1];

        if (c === '"' && quote && next === '"') {
          val += '"';
          i++;
        } else if (c === '"') {
          quote = !quote;
        } else if (c === ',' && !quote) {
          row.push(val.trim());
          val = '';
        } else if ((c === '\r' || c === '\n') && !quote) {
          if (c === '\r' && next === '\n') i++;
          row.push(val.trim());
          if (row.some(item => item !== '')) rows.push(row);
          row = [];
          val = '';
        } else {
          val += c;
        }
      }
      if (val || row.length > 0) {
        row.push(val.trim());
        if (row.some(item => item !== '')) rows.push(row);
      }
      return rows;
    }

    // CORSフォールバック取得
    async function fetchCSVWithFallback(url) {
      const target = url + (url.includes('?') ? '&' : '?') + '_ts=' + Date.now();
      
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 4000);
        const res = await fetch(target, { signal: controller.signal });
        clearTimeout(timeoutId);
        if (res.ok) {
          return await res.text();
        }
      } catch (err) {
        console.warn('Direct fetch blocked by CORS or timed out. Trying proxy fallback...');
      }

      const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(target);
      const proxyRes = await fetch(proxyUrl);
      if (!proxyRes.ok) throw new Error('Proxy fetch failed');
      return await proxyRes.text();
    }

    let records = [];
    let sortState = 'none';

    async function init() {
      const stateEl = document.getElementById('state');
      const tableEl = document.getElementById('table');

      try {
        const csvText = await fetchCSVWithFallback(CSV_URL);
        const rows = parseCSV(csvText);

        const dataRows = (rows.length > 0 && (rows[0][0] === '単語' || rows[0][1] === '品詞' || rows[0][0] === 'Boli'))
          ? rows.slice(1)
          : rows;

        // 単語（A列）ごとにグループ化
        const groupedMap = new Map();

        dataRows.forEach(r => {
          const raw = (r[0] || '').trim();
          if (!raw) return;

          const sense = {
            pos: (r[1] || '').trim(),
            pron: (r[2] || '').trim(),
            mean: (r[3] || '').trim(),
            detail: (r[5] || '').trim()
          };

          if (!groupedMap.has(raw)) {
            groupedMap.set(raw, {
              id: groupedMap.size,
              raw: raw,
              word: convertKazadok(raw),
              restoredWord: normalizeQuery(restorePhonemes(raw)),
              senses: [sense]
            });
          } else {
            groupedMap.get(raw).senses.push(sense);
          }
        });

        records = Array.from(groupedMap.values());

        applyView();
        stateEl.style.display = 'none';
        tableEl.style.display = 'table';
      } catch (e) {
        console.error(e);
        stateEl.textContent = 'Error: Failed to load data.';
      }
    }

    function applyView() {
      const rawInput = document.getElementById('filter').value.trim();
      const qNorm = normalizeQuery(rawInput);
      const qLower = rawInput.toLowerCase();

      // 検索照合（生データq, r, vは除外し、復元した単語または各語義のテキストに一致するか判定）
      let list = !rawInput ? [...records] : records.filter(item => {
        if (item.restoredWord.includes(qNorm)) return true;
        return item.senses.some(s =>
          s.pos.toLowerCase().includes(qLower) ||
          s.pron.toLowerCase().includes(qLower) ||
          s.mean.toLowerCase().includes(qLower) ||
          s.detail.toLowerCase().includes(qLower)
        );
      });

      // 代表品詞によるソート
      if (sortState === 'asc') {
        list.sort((a, b) => {
          const posA = a.senses[0]?.pos || '';
          const posB = b.senses[0]?.pos || '';
          return posA.localeCompare(posB, 'ja') || a.id - b.id;
        });
      } else if (sortState === 'desc') {
        list.sort((a, b) => {
          const posA = a.senses[0]?.pos || '';
          const posB = b.senses[0]?.pos || '';
          return posB.localeCompare(posA, 'ja') || a.id - b.id;
        });
      } else {
        list.sort((a, b) => a.id - b.id);
      }

      render(list);
    }

    function render(list) {
      const tbody = document.getElementById('tbody');
      const countEl = document.getElementById('count');
      tbody.innerHTML = '';
      countEl.textContent = `${list.length} BOLI`;

      const frag = document.createDocumentFragment();
      list.forEach(item => {
        // 表示用テキストの整形
        const posText = item.senses.map(s => s.pos).filter(Boolean).join('\n');
        
        // 発音（重複排除して表示）
        const prons = [...new Set(item.senses.map(s => s.pron).filter(Boolean))];
        const pronText = prons.join('\n');

        // 意味（複数ある場合は連番付与）
        let meanText = '';
        if (item.senses.length === 1) {
          meanText = item.senses[0].mean;
        } else {
          meanText = item.senses
            .map((s, idx) => `${idx + 1}. ${s.mean}`)
            .join('\n');
        }

        // メイン行
        const trWord = document.createElement('tr');
        trWord.className = 'word-row';
        trWord.id = `word-${item.id}`;

        const tdWord = document.createElement('td');
        tdWord.className = 'col-word';
        tdWord.textContent = item.word;
        tdWord.title = item.raw;

        const tdPos = document.createElement('td');
        tdPos.className = 'col-pos';
        tdPos.textContent = posText;

        const tdPron = document.createElement('td');
        tdPron.className = 'col-pron';
        tdPron.textContent = pronText;

        const tdMean = document.createElement('td');
        tdMean.className = 'col-mean';
        tdMean.textContent = meanText;

        trWord.appendChild(tdWord);
        trWord.appendChild(tdPos);
        trWord.appendChild(tdPron);
        trWord.appendChild(tdMean);

        // 詳細・ニュアンス展開行
        const trDetail = document.createElement('tr');
        trDetail.className = 'detail-row';
        trDetail.id = `detail-${item.id}`;

        const tdDetail = document.createElement('td');
        tdDetail.colSpan = 4;

        const wrapper = document.createElement('div');
        wrapper.className = 'detail-wrapper';

        const inner = document.createElement('div');
        inner.className = 'detail-inner';

        const content = document.createElement('div');
        content.className = 'detail-content';

        // 各語義ごとの詳細・ニュアンスを展開
        item.senses.forEach((s, idx) => {
          const detailItem = document.createElement('div');
          detailItem.className = 'detail-item';

          // 複数ある場合は見出しに品詞や意味を添える
          if (item.senses.length > 1) {
            const head = document.createElement('div');
            head.className = 'detail-sub-heading';
            head.textContent = `${idx + 1}. ${s.pos ? `[${s.pos}] ` : ''}${s.mean}`;
            detailItem.appendChild(head);
          } else {
            const head = document.createElement('div');
            head.className = 'detail-sub-heading';
            head.textContent = 'Detail / Nuance';
            detailItem.appendChild(head);
          }

          const body = document.createElement('div');
          if (s.detail.trim()) {
            body.className = 'detail-body';
            body.textContent = s.detail;
          } else {
            body.className = 'detail-empty';
            body.textContent = '-';
          }
          detailItem.appendChild(body);

          content.appendChild(detailItem);
        });

        inner.appendChild(content);
        wrapper.appendChild(inner);
        tdDetail.appendChild(wrapper);
        trDetail.appendChild(tdDetail);

        // タップ開閉イベント
        const toggleRow = () => {
          const isOpen = trDetail.classList.contains('expanded');
          if (isOpen) {
            trDetail.classList.remove('expanded');
            trWord.classList.remove('expanded');
          } else {
            trDetail.classList.add('expanded');
            trWord.classList.add('expanded');
          }
        };

        trWord.addEventListener('click', toggleRow);
        trDetail.addEventListener('click', toggleRow);

        frag.appendChild(trWord);
        frag.appendChild(trDetail);
      });
      tbody.appendChild(frag);
    }

    // 全て開く
    document.getElementById('btn-open-all').addEventListener('click', () => {
      document.querySelectorAll('tr.word-row').forEach(tr => tr.classList.add('expanded'));
      document.querySelectorAll('tr.detail-row').forEach(tr => tr.classList.add('expanded'));
    });

    // すべて閉じる
    document.getElementById('btn-close-all').addEventListener('click', () => {
      document.querySelectorAll('tr.word-row').forEach(tr => tr.classList.remove('expanded'));
      document.querySelectorAll('tr.detail-row').forEach(tr => tr.classList.remove('expanded'));
    });

    // 品詞ソート
    const thPos = document.getElementById('th-pos');
    thPos.addEventListener('click', () => {
      if (sortState === 'none') {
        sortState = 'asc';
        thPos.className = 'col-pos sortable asc';
      } else if (sortState === 'asc') {
        sortState = 'desc';
        thPos.className = 'col-pos sortable desc';
      } else {
        sortState = 'none';
        thPos.className = 'col-pos sortable';
      }
      applyView();
    });

    // 検索入力時の反映
    document.getElementById('filter').addEventListener('input', applyView);

    init();
  </script>
</body>
</html>
