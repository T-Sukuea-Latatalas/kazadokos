<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAZADOK</title>
  <style>
    @font-face {
      font-family: 'NotoSansKazadok';
      src: url('./Noto_Sans_Kazadok.otf') format('opentype');
      font-display: swap;
    }

    :root {
      --bg: #ffffff;
      --text: #000000;
      --border: #000000;
      --line: #e5e5e5;
      --sub: #888888;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding: 40px;
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 30px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    h1 {
      font-size: 1.1rem;
      letter-spacing: 0.25em;
      font-weight: 700;
      text-transform: uppercase;
    }

    .count {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      color: var(--sub);
      text-transform: uppercase;
    }

    /* 画面上部固定バー */
    .sticky-bar {
      position: sticky;
      top: 0;
      background-color: var(--bg);
      z-index: 100;
      padding-top: 10px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .search-box {
      flex: 1;
    }

    .search-box input {
      width: 100%;
      background: transparent;
      border: none;
      padding: 8px 0;
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
      letter-spacing: 0.05em;
    }

    .search-box input::placeholder {
      color: var(--sub);
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      padding: 8px 14px;
      cursor: pointer;
      font-weight: 600;
      outline: none;
      transition: background-color 0.15s, color 0.15s;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .btn:hover {
      background: var(--text);
      color: var(--bg);
    }

    .btn.asc::after {
      content: ' ↑';
    }

    .btn.desc::after {
      content: ' ↓';
    }

    /* 単語リスト一覧 */
    .dict-list {
      width: 100%;
      border-top: 1px solid var(--line);
    }

    /* 単語カード（枠全体） */
    .word-card {
      border-bottom: 1px solid var(--line);
      padding: 22px 16px;
      cursor: pointer;
      transition: background-color 0.15s ease;
      background-color: var(--bg);
    }

    .word-card:hover {
      background-color: #fafafa;
    }

    .word-card.expanded {
      background-color: #f7f7f7;
    }

    /* 1段目: [単語] [発音] */
    .word-header {
      display: flex;
      align-items: baseline;
      gap: 18px;
      margin-bottom: 14px;
    }

    .word-title {
      font-family: 'NotoSansKazadok', sans-serif;
      font-size: 1.55rem;
      letter-spacing: 0.05em;
      color: var(--text);
      line-height: 1.1;
    }

    .word-pron {
      font-family: "Lucida Console", Monaco, monospace;
      font-size: 0.85rem;
      letter-spacing: 0.02em;
      color: var(--sub);
    }

    /* 品詞・意味・ニュアンスのコンテナ */
    .senses-container {
      display: flex;
      flex-direction: column;
    }

    /* 各品詞ブロック */
    .sense-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 6px 0;
    }

    /* 枠内で異なる品詞間の横線区切り */
    .sense-block.divider {
      margin-top: 10px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    /* 2段目: [品詞] [意味] */
    .sense-main {
      display: flex;
      align-items: baseline;
      gap: 16px;
    }

    .sense-pos {
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      font-weight: 600;
      color: var(--sub);
      min-width: 64px;
      flex-shrink: 0;
    }

    .sense-mean {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text);
      white-space: pre-wrap;
      flex: 1;
    }

    /* 3段目: [ニュアンス]（アコーディオンアニメーション） */
    .nuance-wrapper {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .word-card.expanded .nuance-wrapper {
      grid-template-rows: 1fr;
    }

    .nuance-inner {
      overflow: hidden;
    }

    .nuance-text {
      padding-top: 6px;
      padding-left: 80px; /* 品詞の幅と揃えて意味の真下に配置 */
      font-size: 0.88rem;
      line-height: 1.65;
      color: var(--sub);
      white-space: pre-wrap;
    }

    .nuance-empty {
      font-style: italic;
    }

    .state {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 40px 0;
      color: var(--sub);
    }

    @media (max-width: 768px) {
      body {
        padding: 30px 16px;
      }
      .sticky-bar {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
        padding-bottom: 14px;
      }
      .actions {
        justify-content: flex-end;
      }
      .word-card {
        padding: 18px 8px;
      }
      .word-title {
        font-size: 1.35rem;
      }
      .sense-main {
        gap: 10px;
      }
      .sense-pos {
        min-width: 50px;
        font-size: 0.75rem;
      }
      .nuance-text {
        padding-left: 60px;
        font-size: 0.82rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Kazadok</h1>
    <span id="count" class="count"></span>
  </header>

  <!-- 画面上部固定バー: 検索バー + CLASSソート + 一括トグルボタン -->
  <div class="sticky-bar">
    <div class="search-box">
      <input type="text" id="filter" placeholder="Search" autocomplete="off">
    </div>
    <div class="actions">
      <button type="button" id="btn-sort" class="btn">Class</button>
      <button type="button" id="btn-toggle-all" class="btn">Open All</button>
    </div>
  </div>

  <div id="state" class="state">Loading</div>

  <div id="dict-list" class="dict-list" style="display: none;"></div>

  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRThahRna9pyj-I9FmmH9sF8jye4uDOuGSK63Ti3KYI9NDcFds8hiASgM8ach7ybrlWjlr8H217wZwC/pub?gid=808368291&single=true&output=csv';

    function convertKazadok(str) {
      if (!str) return '';
      return str
        .replace(/\^/g, '\u0304')
        .replace(/´/g, '');
    }

    function restorePhonemes(str) {
      if (!str) return '';
      return str
        .replace(/q/g, 'ts')
        .replace(/Q/g, 'TS')
        .replace(/r/g, 'sh')
        .replace(/R/g, 'SH')
        .replace(/v/g, 'ly')
        .replace(/V/g, 'LY')
        .replace(/´/g, '');
    }

    function normalizeQuery(str) {
      if (!str) return '';
      return str.toLowerCase()
        .replace(/-/g, '^')
        .replace(/\u0304/g, '^')
        .replace(/´/g, '');
    }

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let val = '';
      let quote = false;

      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const next = text[i + 1];

        if (c === '"' && quote && next === '"') {
          val += '"';
          i++;
        } else if (c === '"') {
          quote = !quote;
        } else if (c === ',' && !quote) {
          row.push(val.trim());
          val = '';
        } else if ((c === '\r' || c === '\n') && !quote) {
          if (c === '\r' && next === '\n') i++;
          row.push(val.trim());
          if (row.some(item => item !== '')) rows.push(row);
          row = [];
          val = '';
        } else {
          val += c;
        }
      }
      if (val || row.length > 0) {
        row.push(val.trim());
        if (row.some(item => item !== '')) rows.push(row);
      }
      return rows;
    }

    async function fetchCSVWithFallback(url) {
      const target = url + (url.includes('?') ? '&' : '?') + '_ts=' + Date.now();
      
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 4000);
        const res = await fetch(target, { signal: controller.signal });
        clearTimeout(timeoutId);
        if (res.ok) {
          return await res.text();
        }
      } catch (err) {
        console.warn('Direct fetch blocked by CORS or timed out. Trying proxy fallback...');
      }

      const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(target);
      const proxyRes = await fetch(proxyUrl);
      if (!proxyRes.ok) throw new Error('Proxy fetch failed');
      return await proxyRes.text();
    }

    let records = [];
    let sortState = 'none';
    let isAllExpanded = false;

    async function init() {
      const stateEl = document.getElementById('state');
      const dictList = document.getElementById('dict-list');

      try {
        const csvText = await fetchCSVWithFallback(CSV_URL);
        const rows = parseCSV(csvText);

        const dataRows = (rows.length > 0 && (rows[0][0] === '単語' || rows[0][1] === '品詞' || rows[0][0] === 'Boli'))
          ? rows.slice(1)
          : rows;

        const groupedMap = new Map();

        dataRows.forEach(r => {
          const raw = (r[0] || '').trim();
          if (!raw) return;

          const sense = {
            pos: (r[1] || '').trim(),
            pron: (r[2] || '').trim(),
            mean: (r[3] || '').trim(),
            detail: (r[5] || '').trim()
          };

          if (!groupedMap.has(raw)) {
            groupedMap.set(raw, {
              id: groupedMap.size,
              raw: raw,
              word: convertKazadok(raw),
              restoredWord: normalizeQuery(restorePhonemes(raw)),
              senses: [sense]
            });
          } else {
            groupedMap.get(raw).senses.push(sense);
          }
        });

        groupedMap.forEach(item => {
          // 代表発音
          const fallbackPron = item.senses.find(s => s.pron)?.pron || '';
          item.mainPron = fallbackPron;

          // 発音の自動引き継ぎ
          item.senses.forEach(s => {
            if (!s.pron) s.pron = fallbackPron;
          });

          // 同じ品詞をまとめてグループ化
          const posMap = new Map();
          item.senses.forEach(s => {
            const posKey = s.pos || '—';
            if (!posMap.has(posKey)) {
              posMap.set(posKey, []);
            }
            posMap.get(posKey).push(s);
          });

          item.posGroups = Array.from(posMap.entries()).map(([pos, senses]) => ({
            pos: pos === '—' ? '' : pos,
            senses: senses
          }));
        });

        records = Array.from(groupedMap.values());

        applyView();
        stateEl.style.display = 'none';
        dictList.style.display = 'block';
      } catch (e) {
        console.error(e);
        stateEl.textContent = 'Error: Failed to load data.';
      }
    }

    function applyView() {
      const rawInput = document.getElementById('filter').value.trim();
      const qNorm = normalizeQuery(rawInput);
      const qLower = rawInput.toLowerCase();

      let list = !rawInput ? [...records] : records.filter(item => {
        if (item.restoredWord.includes(qNorm)) return true;
        return item.senses.some(s =>
          s.pos.toLowerCase().includes(qLower) ||
          s.pron.toLowerCase().includes(qLower) ||
          s.mean.toLowerCase().includes(qLower) ||
          s.detail.toLowerCase().includes(qLower)
        );
      });

      if (sortState === 'asc') {
        list.sort((a, b) => {
          const posA = a.posGroups[0]?.pos || '';
          const posB = b.posGroups[0]?.pos || '';
          return posA.localeCompare(posB, 'ja') || a.id - b.id;
        });
      } else if (sortState === 'desc') {
        list.sort((a, b) => {
          const posA = a.posGroups[0]?.pos || '';
          const posB = b.posGroups[0]?.pos || '';
          return posB.localeCompare(posA, 'ja') || a.id - b.id;
        });
      } else {
        list.sort((a, b) => a.id - b.id);
      }

      render(list);
    }

    function render(list) {
      const dictList = document.getElementById('dict-list');
      const countEl = document.getElementById('count');
      dictList.innerHTML = '';
      countEl.textContent = `${list.length} BOLI`;

      const frag = document.createDocumentFragment();

      list.forEach(item => {
        // 単語カード枠
        const card = document.createElement('div');
        card.className = `word-card ${isAllExpanded ? 'expanded' : ''}`;
        card.dataset.wordId = item.id;

        // 1段目: [単語] [発音]
        const header = document.createElement('div');
        header.className = 'word-header';

        const title = document.createElement('span');
        title.className = 'word-title';
        title.textContent = item.word;
        title.title = item.raw;

        const pron = document.createElement('span');
        pron.className = 'word-pron';
        pron.textContent = item.mainPron;

        header.appendChild(title);
        header.appendChild(pron);
        card.appendChild(header);

        // 品詞・意味・ニュアンスのコンテナ
        const sensesContainer = document.createElement('div');
        sensesContainer.className = 'senses-container';

        item.posGroups.forEach((group, gIndex) => {
          const block = document.createElement('div');
          block.className = `sense-block ${gIndex > 0 ? 'divider' : ''}`;

          // 2段目: [品詞] [意味]
          const main = document.createElement('div');
          main.className = 'sense-main';

          const pos = document.createElement('span');
          pos.className = 'sense-pos';
          pos.textContent = group.pos;

          const mean = document.createElement('div');
          mean.className = 'sense-mean';
          if (group.senses.length === 1) {
            mean.textContent = group.senses[0].mean;
          } else {
            mean.textContent = group.senses
              .map((s, idx) => `${idx + 1}. ${s.mean}`)
              .join('\n');
          }

          main.appendChild(pos);
          main.appendChild(mean);
          block.appendChild(main);

          // 3段目: [ニュアンス]（折りたたみ展開領域）
          const nuanceWrapper = document.createElement('div');
          nuanceWrapper.className = 'nuance-wrapper';

          const nuanceInner = document.createElement('div');
          nuanceInner.className = 'nuance-inner';

          const nuanceText = document.createElement('div');
          nuanceText.className = 'nuance-text';

          if (group.senses.length === 1) {
            const dText = group.senses[0].detail.trim();
            nuanceText.textContent = dText || '-';
            if (!dText) nuanceText.className += ' nuance-empty';
          } else {
            nuanceText.textContent = group.senses
              .map((s, idx) => `${idx + 1}. ${s.detail.trim() || '-'}`)
              .join('\n');
          }

          nuanceInner.appendChild(nuanceText);
          nuanceWrapper.appendChild(nuanceInner);
          block.appendChild(nuanceWrapper);

          sensesContainer.appendChild(block);
        });

        card.appendChild(sensesContainer);

        // タップ開閉
        card.addEventListener('click', () => {
          card.classList.toggle('expanded');
          updateButtonState();
        });

        frag.appendChild(card);
      });

      dictList.appendChild(frag);
      updateButtonState();
    }

    // トグルボタンの状態更新
    function updateButtonState() {
      const btnToggle = document.getElementById('btn-toggle-all');
      const cards = document.querySelectorAll('.word-card');
      const expandedCards = document.querySelectorAll('.word-card.expanded');

      if (cards.length > 0 && expandedCards.length === cards.length) {
        isAllExpanded = true;
        btnToggle.textContent = 'Close All';
      } else {
        isAllExpanded = false;
        btnToggle.textContent = 'Open All';
      }
    }

    // OPEN ALL / CLOSE ALL トグルボタン
    document.getElementById('btn-toggle-all').addEventListener('click', () => {
      isAllExpanded = !isAllExpanded;
      const cards = document.querySelectorAll('.word-card');
      cards.forEach(card => card.classList.toggle('expanded', isAllExpanded));
      updateButtonState();
    });

    // CLASSソートボタン
    const btnSort = document.getElementById('btn-sort');
    btnSort.addEventListener('click', () => {
      if (sortState === 'none') {
        sortState = 'asc';
        btnSort.className = 'btn asc';
      } else if (sortState === 'asc') {
        sortState = 'desc';
        btnSort.className = 'btn desc';
      } else {
        sortState = 'none';
        btnSort.className = 'btn';
      }
      applyView();
    });

    document.getElementById('filter').addEventListener('input', applyView);

    init();
  </script>
</body>
</html>
