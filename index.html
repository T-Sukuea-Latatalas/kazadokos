<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAZADOK</title>
  <style>
    @font-face {
      font-family: 'NotoSansKazadok';
      src: url('./Noto_Sans_Kazadok.otf') format('opentype');
      font-display: swap;
    }

    :root {
      --bg: #ffffff;
      --text: #000000;
      --border: #000000;
      --line: #e5e5e5;
      --sub: #888888;
      --detail-bg: #fafafa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding: 60px 40px;
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 50px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    h1 {
      font-size: 1.1rem;
      letter-spacing: 0.25em;
      font-weight: 700;
      text-transform: uppercase;
    }

    .count {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      color: var(--sub);
      text-transform: uppercase;
    }

    /* 検索ボックスとモード切り替え */
    .search-bar {
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
      gap: 16px;
    }

    .search-bar input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 12px 0;
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
      border-radius: 0;
      letter-spacing: 0.05em;
      cursor: text;
    }

    .search-bar input::placeholder {
      color: var(--sub);
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .mode-toggle {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      padding: 6px 14px;
      cursor: pointer;
      font-weight: 600;
      outline: none;
      transition: background-color 0.1s, color 0.1s;
      white-space: nowrap;
    }

    .mode-toggle:hover {
      background: var(--text);
      color: var(--bg);
    }

    /* ソフトウェアキーボード */
    .keyboard-panel {
      display: none;
      border: 1px solid var(--border);
      padding: 20px;
      margin-bottom: 40px;
      background: var(--bg);
      user-select: none;
      -webkit-user-select: none;
    }

    .keyboard-panel.active {
      display: block;
    }

    .kb-row {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .kb-row:last-child {
      margin-bottom: 0;
    }

    .kb-key {
      flex: 1;
      max-width: 58px;
      height: 52px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      transition: background-color 0.1s, color 0.1s;
    }

    .kb-key:hover {
      background: var(--text);
      color: var(--bg);
    }

    .kb-key:hover .kb-sub {
      color: var(--bg);
    }

    .kb-sub {
      font-size: 0.65rem;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      line-height: 1;
      margin-bottom: 3px;
      color: var(--sub);
      letter-spacing: 0.05em;
    }

    .kb-main {
      font-family: 'NotoSansKazadok', sans-serif;
      font-size: 1.25rem;
      line-height: 1;
    }

    .kb-key.action-key {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      font-weight: 600;
    }

    .kb-key.key-del {
      max-width: 70px;
    }

    .kb-key.key-space {
      max-width: 220px;
    }

    .kb-key.key-switch {
      max-width: 100px;
    }

    .kb-key.key-clear {
      max-width: 70px;
    }

    /* テーブルスタイル */
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 600;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--sub);
      user-select: none;
    }

    th.sortable {
      cursor: pointer;
      transition: color 0.15s ease;
    }

    th.sortable:hover {
      color: var(--text);
    }

    th.sortable.asc::after {
      content: ' ↑';
      color: var(--text);
    }

    th.sortable.desc::after {
      content: ' ↓';
      color: var(--text);
    }

    td {
      padding: 16px 14px;
      border-bottom: 1px solid var(--line);
      vertical-align: baseline;
      font-size: 0.95rem;
    }

    /* 単語データ行（クリック可能） */
    tr.word-row {
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    tr.word-row:hover {
      background-color: #f9f9f9;
    }

    tr.word-row.expanded {
      background-color: #f2f2f2;
      border-bottom: none;
    }

    /* F列 詳細・ニュアンス展開枠 */
    tr.detail-row {
      display: none;
    }

    tr.detail-row.expanded {
      display: table-row;
    }

    tr.detail-row td {
      padding: 24px 20px;
      background-color: var(--detail-bg);
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    .detail-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .detail-heading {
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--sub);
      font-weight: 600;
    }

    .detail-body {
      font-size: 0.9rem;
      line-height: 1.7;
      color: var(--text);
      white-space: pre-wrap; /* 改行を反映 */
    }

    .detail-empty {
      font-size: 0.85rem;
      color: var(--sub);
      font-style: italic;
    }

    .col-word {
      font-family: 'NotoSansKazadok', sans-serif;
      font-size: 1.4rem;
      letter-spacing: 0.05em;
      white-space: nowrap;
      width: 28%;
    }

    .col-pos {
      width: 14%;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
    }

    .col-pron {
      width: 24%;
      font-family: "Lucida Console", Monaco, monospace;
      font-size: 0.85rem;
      letter-spacing: 0.02em;
    }

    .col-mean {
      width: 34%;
    }

    .state {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 40px 0;
      color: var(--sub);
    }

    @media (max-width: 768px) {
      body {
        padding: 40px 16px;
      }
      th, td {
        padding: 12px 8px;
      }
      .col-word {
        font-size: 1.2rem;
      }
      .kb-key {
        height: 44px;
      }
      .kb-main {
        font-size: 1rem;
      }
      .kb-sub {
        font-size: 0.55rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Kazadok</h1>
    <span id="count" class="count"></span>
  </header>

  <div class="search-bar">
    <input type="text" id="filter" placeholder="Search" autocomplete="off" inputmode="none">
    <button type="button" id="mode-btn" class="mode-toggle">KAZADOK</button>
  </div>

  <!-- QWERTY ソフトウェアキーボード -->
  <div id="keyboard" class="keyboard-panel">
    <!-- Row 1 -->
    <div class="kb-row">
      <button type="button" class="kb-key" data-char="q"><span class="kb-sub">ts</span><span class="kb-main">q</span></button>
      <button type="button" class="kb-key" data-char="w"><span class="kb-sub">w</span><span class="kb-main">w</span></button>
      <button type="button" class="kb-key" data-char="e"><span class="kb-sub">e</span><span class="kb-main">e</span></button>
      <button type="button" class="kb-key" data-char="r"><span class="kb-sub">sh</span><span class="kb-main">r</span></button>
      <button type="button" class="kb-key" data-char="t"><span class="kb-sub">t</span><span class="kb-main">t</span></button>
      <button type="button" class="kb-key" data-char="y"><span class="kb-sub">y</span><span class="kb-main">y</span></button>
      <button type="button" class="kb-key" data-char="u"><span class="kb-sub">u</span><span class="kb-main">u</span></button>
      <button type="button" class="kb-key" data-char="i"><span class="kb-sub">i</span><span class="kb-main">i</span></button>
      <button type="button" class="kb-key" data-char="o"><span class="kb-sub">o</span><span class="kb-main">o</span></button>
      <button type="button" class="kb-key" data-char="p"><span class="kb-sub">p</span><span class="kb-main">p</span></button>
      <button type="button" class="kb-key" data-char="-"><span class="kb-sub">-</span><span class="kb-main">&#772;</span></button>
    </div>
    <!-- Row 2 -->
    <div class="kb-row">
      <button type="button" class="kb-key" data-char="a"><span class="kb-sub">a</span><span class="kb-main">a</span></button>
      <button type="button" class="kb-key" data-char="s"><span class="kb-sub">s</span><span class="kb-main">s</span></button>
      <button type="button" class="kb-key" data-char="d"><span class="kb-sub">d</span><span class="kb-main">d</span></button>
      <button type="button" class="kb-key" data-char="f"><span class="kb-sub">f</span><span class="kb-main">f</span></button>
      <button type="button" class="kb-key" data-char="g"><span class="kb-sub">g</span><span class="kb-main">g</span></button>
      <button type="button" class="kb-key" data-char="h"><span class="kb-sub">h</span><span class="kb-main">h</span></button>
      <button type="button" class="kb-key" data-char="j"><span class="kb-sub">j</span><span class="kb-main">j</span></button>
      <button type="button" class="kb-key" data-char="k"><span class="kb-sub">k</span><span class="kb-main">k</span></button>
      <button type="button" class="kb-key" data-char="l"><span class="kb-sub">l</span><span class="kb-main">l</span></button>
    </div>
    <!-- Row 3 -->
    <div class="kb-row">
      <button type="button" class="kb-key" data-char="z"><span class="kb-sub">z</span><span class="kb-main">z</span></button>
      <button type="button" class="kb-key" data-char="x"><span class="kb-sub">x</span><span class="kb-main">x</span></button>
      <button type="button" class="kb-key" data-char="c"><span class="kb-sub">c</span><span class="kb-main">c</span></button>
      <button type="button" class="kb-key" data-char="v"><span class="kb-sub">ly</span><span class="kb-main">v</span></button>
      <button type="button" class="kb-key" data-char="b"><span class="kb-sub">b</span><span class="kb-main">b</span></button>
      <button type="button" class="kb-key" data-char="n"><span class="kb-sub">n</span><span class="kb-main">n</span></button>
      <button type="button" class="kb-key" data-char="m"><span class="kb-sub">m</span><span class="kb-main">m</span></button>
      <button type="button" class="kb-key action-key key-del" data-action="backspace">DEL</button>
    </div>
    <!-- Row 4 -->
    <div class="kb-row">
      <button type="button" class="kb-key action-key key-space" data-action="space">SPACE</button>
      <button type="button" class="kb-key action-key key-switch" data-action="switch-os">STANDARD</button>
      <button type="button" class="kb-key action-key key-clear" data-action="clear">CLEAR</button>
    </div>
  </div>

  <div id="state" class="state">Loading</div>

  <table id="table" style="display: none;">
    <thead>
      <tr>
        <th class="col-word">Boli</th>
        <th class="col-pos sortable" id="th-pos">Class</th>
        <th class="col-pron">Pronunciation</th>
        <th class="col-mean">Meaning</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRThahRna9pyj-I9FmmH9sF8jye4uDOuGSK63Ti3KYI9NDcFds8hiASgM8ach7ybrlWjlr8H217wZwC/pub?gid=808368291&single=true&output=csv';

    // A列用 置換処理（^ -> ̄、´ -> 消去 のみ残す）
    function convertKazadok(str) {
      if (!str) return '';
      return str
        .replace(/\^/g, '\u0304')
        .replace(/´/g, '');
    }

    // 検索語句正規化（- / ^ / ̄ のゆらぎ吸収）
    function normalizeQuery(str) {
      if (!str) return '';
      return str.toLowerCase()
        .replace(/-/g, '^')
        .replace(/\u0304/g, '^')
        .replace(/´/g, '');
    }

    // CSV解析パーサー
    function parseCSV(text) {
      const rows = [];
      let row = [];
      let val = '';
      let quote = false;

      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const next = text[i + 1];

        if (c === '"' && quote && next === '"') {
          val += '"';
          i++;
        } else if (c === '"') {
          quote = !quote;
        } else if (c === ',' && !quote) {
          row.push(val.trim());
          val = '';
        } else if ((c === '\r' || c === '\n') && !quote) {
          if (c === '\r' && next === '\n') i++;
          row.push(val.trim());
          if (row.some(item => item !== '')) rows.push(row);
          row = [];
          val = '';
        } else {
          val += c;
        }
      }
      if (val || row.length > 0) {
        row.push(val.trim());
        if (row.some(item => item !== '')) rows.push(row);
      }
      return rows;
    }

    // CORS回避付きフェッチ
    async function fetchCSVWithFallback(url) {
      const target = url + (url.includes('?') ? '&' : '?') + '_ts=' + Date.now();
      
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 4000);
        const res = await fetch(target, { signal: controller.signal });
        clearTimeout(timeoutId);
        if (res.ok) {
          return await res.text();
        }
      } catch (err) {
        console.warn('Direct fetch blocked by CORS or timed out. Trying proxy fallback...');
      }

      const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(target);
      const proxyRes = await fetch(proxyUrl);
      if (!proxyRes.ok) throw new Error('Proxy fetch failed');
      return await proxyRes.text();
    }

    let records = [];
    let sortState = 'none';

    async function init() {
      const stateEl = document.getElementById('state');
      const tableEl = document.getElementById('table');

      try {
        const csvText = await fetchCSVWithFallback(CSV_URL);
        const rows = parseCSV(csvText);

        const dataRows = (rows.length > 0 && (rows[0][0] === '単語' || rows[0][1] === '品詞' || rows[0][0] === 'Boli'))
          ? rows.slice(1)
          : rows;

        records = dataRows.map((r, index) => {
          const raw = r[0] || '';
          return {
            id: index,
            raw: raw,
            word: convertKazadok(raw),
            normalizedRaw: normalizeQuery(raw),
            pos: r[1] || '',
            pron: r[2] || '',
            mean: r[3] || '',
            detail: r[5] || '' // F列: 詳細・ニュアンス (インデックス5)
          };
        }).filter(item => item.raw !== '');

        applyView();
        stateEl.style.display = 'none';
        tableEl.style.display = 'table';
      } catch (e) {
        console.error(e);
        stateEl.textContent = 'Error: Failed to load data.';
      }
    }

    function applyView() {
      const rawInput = document.getElementById('filter').value.trim();
      const qNorm = normalizeQuery(rawInput);
      const qLower = rawInput.toLowerCase();

      let list = !rawInput ? [...records] : records.filter(item =>
        item.normalizedRaw.includes(qNorm) ||
        item.raw.toLowerCase().includes(qLower) ||
        item.word.toLowerCase().includes(qLower) ||
        item.pos.toLowerCase().includes(qLower) ||
        item.pron.toLowerCase().includes(qLower) ||
        item.mean.toLowerCase().includes(qLower) ||
        item.detail.toLowerCase().includes(qLower)
      );

      if (sortState === 'asc') {
        list.sort((a, b) => a.pos.localeCompare(b.pos, 'ja') || a.id - b.id);
      } else if (sortState === 'desc') {
        list.sort((a, b) => b.pos.localeCompare(a.pos, 'ja') || a.id - b.id);
      } else {
        list.sort((a, b) => a.id - b.id);
      }

      render(list);
    }

    function render(list) {
      const tbody = document.getElementById('tbody');
      const countEl = document.getElementById('count');
      tbody.innerHTML = '';
      countEl.textContent = `${list.length} BOLI`;

      const frag = document.createDocumentFragment();
      list.forEach(item => {
        // メイン行
        const trWord = document.createElement('tr');
        trWord.className = 'word-row';
        trWord.dataset.id = item.id;

        const tdWord = document.createElement('td');
        tdWord.className = 'col-word';
        tdWord.textContent = item.word;
        tdWord.title = item.raw;

        const tdPos = document.createElement('td');
        tdPos.className = 'col-pos';
        tdPos.textContent = item.pos;

        const tdPron = document.createElement('td');
        tdPron.className = 'col-pron';
        tdPron.textContent = item.pron;

        const tdMean = document.createElement('td');
        tdMean.className = 'col-mean';
        tdMean.textContent = item.mean;

        trWord.appendChild(tdWord);
        trWord.appendChild(tdPos);
        trWord.appendChild(tdPron);
        trWord.appendChild(tdMean);

        // 詳細・ニュアンス行（F列）
        const trDetail = document.createElement('tr');
        trDetail.className = 'detail-row';
        trDetail.id = `detail-${item.id}`;

        const tdDetail = document.createElement('td');
        tdDetail.colSpan = 4;

        const detailContainer = document.createElement('div');
        detailContainer.className = 'detail-container';

        const detailHead = document.createElement('div');
        detailHead.className = 'detail-heading';
        detailHead.textContent = 'Detail / Nuance';

        const detailBody = document.createElement('div');
        if (item.detail.trim()) {
          detailBody.className = 'detail-body';
          detailBody.textContent = item.detail;
        } else {
          detailBody.className = 'detail-empty';
          detailBody.textContent = '-';
        }

        detailContainer.appendChild(detailHead);
        detailContainer.appendChild(detailBody);
        tdDetail.appendChild(detailContainer);
        trDetail.appendChild(tdDetail);

        // タップ/クリックで開閉（トグル）
        const toggleRow = () => {
          const isOpen = trDetail.classList.contains('expanded');
          if (isOpen) {
            trDetail.classList.remove('expanded');
            trWord.classList.remove('expanded');
          } else {
            trDetail.classList.add('expanded');
            trWord.classList.add('expanded');
          }
        };

        trWord.addEventListener('click', toggleRow);
        trDetail.addEventListener('click', toggleRow);

        frag.appendChild(trWord);
        frag.appendChild(trDetail);
      });
      tbody.appendChild(frag);
    }

    const thPos = document.getElementById('th-pos');
    thPos.addEventListener('click', () => {
      if (sortState === 'none') {
        sortState = 'asc';
        thPos.className = 'col-pos sortable asc';
      } else if (sortState === 'asc') {
        sortState = 'desc';
        thPos.className = 'col-pos sortable desc';
      } else {
        sortState = 'none';
        thPos.className = 'col-pos sortable';
      }
      applyView();
    });

    const filterInput = document.getElementById('filter');
    const keyboardEl = document.getElementById('keyboard');
    const modeBtn = document.getElementById('mode-btn');

    let currentMode = 'kazadok';

    function setKeyboardMode(mode) {
      currentMode = mode;
      if (mode === 'kazadok') {
        modeBtn.textContent = 'KAZADOK';
        filterInput.setAttribute('inputmode', 'none');
        keyboardEl.classList.add('active');
      } else {
        modeBtn.textContent = 'STANDARD';
        filterInput.removeAttribute('inputmode');
        filterInput.setAttribute('inputmode', 'text');
        keyboardEl.classList.remove('active');
      }
      filterInput.focus();
    }

    modeBtn.addEventListener('click', () => {
      setKeyboardMode(currentMode === 'kazadok' ? 'standard' : 'kazadok');
    });

    filterInput.addEventListener('input', applyView);

    filterInput.addEventListener('focus', () => {
      if (currentMode === 'kazadok') {
        keyboardEl.classList.add('active');
      }
    });

    keyboardEl.addEventListener('pointerdown', (e) => {
      e.preventDefault();
    });

    document.addEventListener('pointerdown', (e) => {
      const isInside = filterInput.contains(e.target) || 
                       keyboardEl.contains(e.target) || 
                       modeBtn.contains(e.target);
      if (!isInside && currentMode === 'kazadok') {
        keyboardEl.classList.remove('active');
      }
    });

    // キーボード入力処理
    keyboardEl.addEventListener('click', (e) => {
      const btn = e.target.closest('.kb-key');
      if (!btn) return;

      const char = btn.getAttribute('data-char');
      const action = btn.getAttribute('data-action');
      const start = filterInput.selectionStart;
      const end = filterInput.selectionEnd;
      let val = filterInput.value;

      if (char) {
        filterInput.value = val.slice(0, start) + char + val.slice(end);
        filterInput.setSelectionRange(start + char.length, start + char.length);
      } else if (action === 'backspace') {
        if (start === end && start > 0) {
          filterInput.value = val.slice(0, start - 1) + val.slice(end);
          filterInput.setSelectionRange(start - 1, start - 1);
        } else if (start !== end) {
          filterInput.value = val.slice(0, start) + val.slice(end);
          filterInput.setSelectionRange(start, start);
        }
      } else if (action === 'space') {
        filterInput.value = val.slice(0, start) + ' ' + val.slice(end);
        filterInput.setSelectionRange(start + 1, start + 1);
      } else if (action === 'clear') {
        filterInput.value = '';
        filterInput.setSelectionRange(0, 0);
      } else if (action === 'switch-os') {
        setKeyboardMode('standard');
        return;
      }

      filterInput.focus();
      applyView();
    });

    init();
  </script>
</body>
</html>
