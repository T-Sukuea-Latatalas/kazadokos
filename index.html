<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAZADOK</title>
  <style>
    @font-face {
      font-family: 'NotoSansKazadok';
      src: url('./Noto_Sans_Kazadok.otf') format('opentype');
      font-display: swap;
    }

    :root {
      --bg: #ffffff;
      --text: #000000;
      --border: #000000;
      --line: #e5e5e5;
      --sub: #888888;
      /* 展開前の列幅: 単語(24%), 発音(20%), 品詞(14%), 意味(42%) */
      --cols-collapsed: 24% 20% 14% 42%;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding: 40px;
      max-width: 1050px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 30px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    h1 {
      font-size: 1.1rem;
      letter-spacing: 0.25em;
      font-weight: 700;
      text-transform: uppercase;
    }

    .count {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      color: var(--sub);
      text-transform: uppercase;
    }

    /* 画面上部固定バー */
    .sticky-bar {
      position: sticky;
      top: 0;
      background-color: var(--bg);
      z-index: 100;
      padding-top: 10px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .search-box {
      flex: 1;
    }

    .search-box input {
      width: 100%;
      background: transparent;
      border: none;
      padding: 8px 0;
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
      letter-spacing: 0.05em;
    }

    .search-box input::placeholder {
      color: var(--sub);
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      padding: 8px 14px;
      cursor: pointer;
      font-weight: 600;
      outline: none;
      transition: background-color 0.15s, color 0.15s;
      white-space: nowrap;
      text-transform: uppercase;
      min-width: 95px;
      text-align: center;
    }

    .btn:hover {
      background: var(--text);
      color: var(--bg);
    }

    .btn.asc::after {
      content: ' ↑';
    }

    .btn.desc::after {
      content: ' ↓';
    }

    /* リストコンテナ */
    .dict-container {
      width: 100%;
      border-top: 1px solid var(--border);
    }

    /* 見出し行（[単語] [発音] [品詞] [意味]） */
    .dict-header {
      display: grid;
      grid-template-columns: var(--cols-collapsed);
      border-bottom: 1px solid var(--border);
      user-select: none;
    }

    .th-cell {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 600;
      padding: 12px 14px;
      color: var(--sub);
      white-space: nowrap;
    }

    .th-cell.sortable {
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .th-cell.sortable:hover {
      color: var(--text);
    }

    .th-cell.sortable.asc::after {
      content: ' ↑';
      color: var(--text);
    }

    .th-cell.sortable.desc::after {
      content: ' ↓';
      color: var(--text);
    }

    /* 単語枠（カード全体） */
    .word-card {
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      background-color: var(--bg);
      transition: background-color 0.15s ease;
    }

    .word-card:hover {
      background-color: #fafafa;
    }

    .word-card.expanded {
      background-color: #f7f7f7;
    }

    /* =========================================================
       1. 展開前ビュー（[単語] [発音] [品詞] [意味]）
       ========================================================= */
    .view-collapsed {
      display: grid;
      grid-template-columns: var(--cols-collapsed);
      width: 100%;
    }

    .word-card.expanded .view-collapsed {
      display: none;
    }

    .cell-c {
      padding: 16px 14px;
      font-size: 0.95rem;
    }

    /* [単語]（Boli）: 枠内で完全上下中央 */
    .cell-c-word {
      font-family: 'NotoSansKazadok', sans-serif;
      font-size: 1.4rem;
      letter-spacing: 0.05em;
      white-space: nowrap;
      align-self: center;
    }

    /* [発音]（Pronunciation）: 枠内で完全上下中央 */
    .cell-c-pron {
      font-family: "Lucida Console", Monaco, monospace;
      font-size: 0.85rem;
      letter-spacing: 0.02em;
      color: var(--sub);
      align-self: center;
    }

    /* [品詞]（Class） */
    .cell-c-pos {
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      line-height: 1.6;
      align-self: center;
    }

    /* [意味]（Meaning） */
    .cell-c-mean {
      white-space: pre-wrap;
      line-height: 1.6;
      align-self: center;
    }

    /* 異なる品詞間の枠内横線（品詞・意味の列にのみ入る） */
    .pos-divider-c {
      border-top: 1px solid var(--line);
    }

    /* =========================================================
       2. 展開後ビュー（縦積みカード配置）
       ========================================================= */
    .view-expanded {
      display: none;
      padding: 22px 18px;
    }

    .word-card.expanded .view-expanded {
      display: block;
      animation: fadeIn 0.2s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-3px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* 上段: [単語] [発音] */
    .exp-header {
      display: flex;
      align-items: baseline;
      gap: 18px;
      margin-bottom: 16px;
    }

    .exp-word {
      font-family: 'NotoSansKazadok', sans-serif;
      font-size: 1.6rem;
      letter-spacing: 0.05em;
      line-height: 1.1;
    }

    .exp-pron {
      font-family: "Lucida Console", Monaco, monospace;
      font-size: 0.9rem;
      letter-spacing: 0.02em;
      color: var(--sub);
    }

    /* 各品詞ブロック */
    .exp-senses {
      display: flex;
      flex-direction: column;
    }

    .exp-sense-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 6px 0;
    }

    /* 枠内で異なる品詞間の横線 */
    .exp-sense-block.divider {
      margin-top: 12px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    /* [品詞] [意味] */
    .exp-sense-main {
      display: flex;
      align-items: baseline;
      gap: 16px;
    }

    .exp-pos {
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      font-weight: 600;
      color: var(--sub);
      min-width: 60px;
      flex-shrink: 0;
    }

    .exp-mean {
      font-size: 0.95rem;
      line-height: 1.6;
      white-space: pre-wrap;
      color: var(--text);
    }

    /* [ニュアンス] */
    .exp-nuance {
      padding-top: 4px;
      padding-left: 76px;
      font-size: 0.88rem;
      line-height: 1.65;
      color: var(--sub);
      white-space: pre-wrap;
    }

    .nuance-empty {
      font-style: italic;
    }

    .state {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 40px 0;
      color: var(--sub);
    }

    @media (max-width: 768px) {
      :root {
        --cols-collapsed: 26% 22% 16% 36%;
      }
      body {
        padding: 30px 16px;
      }
      .sticky-bar {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
        padding-bottom: 14px;
      }
      .actions {
        justify-content: flex-end;
      }
      .cell-c, .th-cell {
        padding: 12px 8px;
      }
      .cell-c-word {
        font-size: 1.2rem;
      }
      .view-expanded {
        padding: 16px 10px;
      }
      .exp-word {
        font-size: 1.35rem;
      }
      .exp-nuance {
        padding-left: 50px;
        font-size: 0.82rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Kazadok</h1>
    <span id="count" class="count"></span>
  </header>

  <!-- 上部固定バー: 検索バー + CLASSソート + 統合トグルボタン -->
  <div class="sticky-bar">
    <div class="search-box">
      <input type="text" id="filter" placeholder="Search" autocomplete="off">
    </div>
    <div class="actions">
      <button type="button" id="btn-sort" class="btn">Class</button>
      <button type="button" id="btn-toggle-all" class="btn">Open All</button>
    </div>
  </div>

  <div id="state" class="state">Loading</div>

  <div id="dict-container" class="dict-container" style="display: none;">
    <!-- 見出し行（[単語] [発音] [品詞] [意味]） -->
    <div class="dict-header">
      <div class="th-cell">Boli</div>
      <div class="th-cell">Pronunciation</div>
      <div class="th-cell sortable" id="th-pos">Class</div>
      <div class="th-cell">Meaning</div>
    </div>
    <!-- 単語リスト -->
    <div id="dict-body"></div>
  </div>

  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRThahRna9pyj-I9FmmH9sF8jye4uDOuGSK63Ti3KYI9NDcFds8hiASgM8ach7ybrlWjlr8H217wZwC/pub?gid=808368291&single=true&output=csv';

    function convertKazadok(str) {
      if (!str) return '';
      return str
        .replace(/\^/g, '\u0304')
        .replace(/´/g, '');
    }

    function restorePhonemes(str) {
      if (!str) return '';
      return str
        .replace(/q/g, 'ts')
        .replace(/Q/g, 'TS')
        .replace(/r/g, 'sh')
        .replace(/R/g, 'SH')
        .replace(/v/g, 'ly')
        .replace(/V/g, 'LY')
        .replace(/´/g, '');
    }

    function normalizeQuery(str) {
      if (!str) return '';
      return str.toLowerCase()
        .replace(/-/g, '^')
        .replace(/\u0304/g, '^')
        .replace(/´/g, '');
    }

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let val = '';
      let quote = false;

      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const next = text[i + 1];

        if (c === '"' && quote && next === '"') {
          val += '"';
          i++;
        } else if (c === '"') {
          quote = !quote;
        } else if (c === ',' && !quote) {
          row.push(val.trim());
          val = '';
        } else if ((c === '\r' || c === '\n') && !quote) {
          if (c === '\r' && next === '\n') i++;
          row.push(val.trim());
          if (row.some(item => item !== '')) rows.push(row);
          row = [];
          val = '';
        } else {
          val += c;
        }
      }
      if (val || row.length > 0) {
        row.push(val.trim());
        if (row.some(item => item !== '')) rows.push(row);
      }
      return rows;
    }

    async function fetchCSVWithFallback(url) {
      const target = url + (url.includes('?') ? '&' : '?') + '_ts=' + Date.now();
      
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 4000);
        const res = await fetch(target, { signal: controller.signal });
        clearTimeout(timeoutId);
        if (res.ok) {
          return await res.text();
        }
      } catch (err) {
        console.warn('Direct fetch blocked by CORS or timed out. Trying proxy fallback...');
      }

      const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(target);
      const proxyRes = await fetch(proxyUrl);
      if (!proxyRes.ok) throw new Error('Proxy fetch failed');
      return await proxyRes.text();
    }

    let records = [];
    let sortState = 'none';
    let isAllExpanded = false;

    async function init() {
      const stateEl = document.getElementById('state');
      const dictContainer = document.getElementById('dict-container');

      try {
        const csvText = await fetchCSVWithFallback(CSV_URL);
        const rows = parseCSV(csvText);

        const dataRows = (rows.length > 0 && (rows[0][0] === '単語' || rows[0][1] === '品詞' || rows[0][0] === 'Boli'))
          ? rows.slice(1)
          : rows;

        const groupedMap = new Map();

        dataRows.forEach(r => {
          const raw = (r[0] || '').trim();
          if (!raw) return;

          const sense = {
            pos: (r[1] || '').trim(),
            pron: (r[2] || '').trim(),
            mean: (r[3] || '').trim(),
            detail: (r[5] || '').trim()
          };

          if (!groupedMap.has(raw)) {
            groupedMap.set(raw, {
              id: groupedMap.size,
              raw: raw,
              word: convertKazadok(raw),
              restoredWord: normalizeQuery(restorePhonemes(raw)),
              senses: [sense]
            });
          } else {
            groupedMap.get(raw).senses.push(sense);
          }
        });

        groupedMap.forEach(item => {
          const fallbackPron = item.senses.find(s => s.pron)?.pron || '';
          item.mainPron = fallbackPron;

          item.senses.forEach(s => {
            if (!s.pron) s.pron = fallbackPron;
          });

          // 同じ品詞をまとめてグループ化
          const posMap = new Map();
          item.senses.forEach(s => {
            const posKey = s.pos || '—';
            if (!posMap.has(posKey)) {
              posMap.set(posKey, []);
            }
            posMap.get(posKey).push(s);
          });

          item.posGroups = Array.from(posMap.entries()).map(([pos, senses]) => ({
            pos: pos === '—' ? '' : pos,
            senses: senses
          }));
        });

        records = Array.from(groupedMap.values());

        applyView();
        stateEl.style.display = 'none';
        dictContainer.style.display = 'block';
      } catch (e) {
        console.error(e);
        stateEl.textContent = 'Error: Failed to load data.';
      }
    }

    function applyView() {
      const rawInput = document.getElementById('filter').value.trim();
      const qNorm = normalizeQuery(rawInput);
      const qLower = rawInput.toLowerCase();

      let list = !rawInput ? [...records] : records.filter(item => {
        if (item.restoredWord.includes(qNorm)) return true;
        return item.senses.some(s =>
          s.pos.toLowerCase().includes(qLower) ||
          s.pron.toLowerCase().includes(qLower) ||
          s.mean.toLowerCase().includes(qLower) ||
          s.detail.toLowerCase().includes(qLower)
        );
      });

      if (sortState === 'asc') {
        list.sort((a, b) => {
          const posA = a.posGroups[0]?.pos || '';
          const posB = b.posGroups[0]?.pos || '';
          return posA.localeCompare(posB, 'ja') || a.id - b.id;
        });
      } else if (sortState === 'desc') {
        list.sort((a, b) => {
          const posA = a.posGroups[0]?.pos || '';
          const posB = b.posGroups[0]?.pos || '';
          return posB.localeCompare(posA, 'ja') || a.id - b.id;
        });
      } else {
        list.sort((a, b) => a.id - b.id);
      }

      render(list);
    }

    function render(list) {
      const dictBody = document.getElementById('dict-body');
      const countEl = document.getElementById('count');
      dictBody.innerHTML = '';
      countEl.textContent = `${list.length} BOLI`;

      const frag = document.createDocumentFragment();

      list.forEach(item => {
        const totalGroups = item.posGroups.length;

        // 単語カードコンテナ
        const card = document.createElement('div');
        card.className = `word-card ${isAllExpanded ? 'expanded' : ''}`;
        card.dataset.wordId = item.id;

        // =========================================================
        // 1. 展開前ビュー: [単語] [発音] [品詞] [意味]
        // =========================================================
        const viewCollapsed = document.createElement('div');
        viewCollapsed.className = 'view-collapsed';

        // [単語]（列1: 全行スパンで上下中央）
        const wordC = document.createElement('div');
        wordC.className = 'cell-c cell-c-word';
        wordC.textContent = item.word;
        wordC.title = item.raw;
        wordC.style.gridColumn = '1';
        wordC.style.gridRow = `1 / span ${totalGroups}`;
        viewCollapsed.appendChild(wordC);

        // [発音]（列2: 全行スパンで上下中央）
        const pronC = document.createElement('div');
        pronC.className = 'cell-c cell-c-pron';
        pronC.textContent = item.mainPron;
        pronC.style.gridColumn = '2';
        pronC.style.gridRow = `1 / span ${totalGroups}`;
        viewCollapsed.appendChild(pronC);

        // 各品詞行（列3: 品詞、列4: 意味）
        item.posGroups.forEach((group, gIndex) => {
          const rowNum = gIndex + 1;
          const isDivider = gIndex > 0;

          // [品詞]（列3）
          const posC = document.createElement('div');
          posC.className = `cell-c cell-c-pos ${isDivider ? 'pos-divider-c' : ''}`;
          posC.textContent = group.pos;
          posC.style.gridColumn = '3';
          posC.style.gridRow = `${rowNum}`;
          viewCollapsed.appendChild(posC);

          // [意味]（列4）
          const meanC = document.createElement('div');
          meanC.className = `cell-c cell-c-mean ${isDivider ? 'pos-divider-c' : ''}`;
          meanC.style.gridColumn = '4';
          meanC.style.gridRow = `${rowNum}`;

          if (group.senses.length === 1) {
            meanC.textContent = group.senses[0].mean;
          } else {
            meanC.textContent = group.senses
              .map((s, idx) => `${idx + 1}. ${s.mean}`)
              .join('\n');
          }
          viewCollapsed.appendChild(meanC);
        });

        card.appendChild(viewCollapsed);

        // =========================================================
        // 2. 展開後ビュー（縦積みカード配置）
        // =========================================================
        const viewExpanded = document.createElement('div');
        viewExpanded.className = 'view-expanded';

        // 上段: [単語] [発音]
        const expHeader = document.createElement('div');
        expHeader.className = 'exp-header';

        const expWord = document.createElement('span');
        expWord.className = 'exp-word';
        expWord.textContent = item.word;

        const expPron = document.createElement('span');
        expPron.className = 'exp-pron';
        expPron.textContent = item.mainPron;

        expHeader.appendChild(expWord);
        expHeader.appendChild(expPron);
        viewExpanded.appendChild(expHeader);

        // 各品詞ブロック
        const expSenses = document.createElement('div');
        expSenses.className = 'exp-senses';

        item.posGroups.forEach((group, gIndex) => {
          const block = document.createElement('div');
          block.className = `exp-sense-block ${gIndex > 0 ? 'divider' : ''}`;

          // [品詞] [意味]
          const main = document.createElement('div');
          main.className = 'exp-sense-main';

          const pos = document.createElement('span');
          pos.className = 'exp-pos';
          pos.textContent = group.pos;

          const mean = document.createElement('div');
          mean.className = 'exp-mean';
          if (group.senses.length === 1) {
            mean.textContent = group.senses[0].mean;
          } else {
            mean.textContent = group.senses
              .map((s, idx) => `${idx + 1}. ${s.mean}`)
              .join('\n');
          }

          main.appendChild(pos);
          main.appendChild(mean);
          block.appendChild(main);

          // [ニュアンス]
          const nuance = document.createElement('div');
          nuance.className = 'exp-nuance';

          if (group.senses.length === 1) {
            const dText = group.senses[0].detail.trim();
            nuance.textContent = dText || '-';
            if (!dText) nuance.className += ' nuance-empty';
          } else {
            nuance.textContent = group.senses
              .map((s, idx) => `${idx + 1}. ${s.detail.trim() || '-'}`)
              .join('\n');
          }

          block.appendChild(nuance);
          expSenses.appendChild(block);
        });

        viewExpanded.appendChild(expSenses);
        card.appendChild(viewExpanded);

        // 個別クリック開閉
        card.addEventListener('click', () => {
          card.classList.toggle('expanded');
          updateButtonState();
        });

        frag.appendChild(card);
      });

      dictBody.appendChild(frag);
      updateButtonState();
    }

    // トグルボタンの状態更新
    function updateButtonState() {
      const btnToggle = document.getElementById('btn-toggle-all');
      const cards = document.querySelectorAll('.word-card');
      const expandedCards = document.querySelectorAll('.word-card.expanded');

      if (cards.length > 0 && expandedCards.length === cards.length) {
        isAllExpanded = true;
        btnToggle.textContent = 'Close All';
      } else {
        isAllExpanded = false;
        btnToggle.textContent = 'Open All';
      }
    }

    // OPEN ALL / CLOSE ALL 統合トグルボタン
    document.getElementById('btn-toggle-all').addEventListener('click', () => {
      isAllExpanded = !isAllExpanded;
      const cards = document.querySelectorAll('.word-card');
      cards.forEach(card => card.classList.toggle('expanded', isAllExpanded));
      updateButtonState();
    });

    // CLASSソートボタン
    const btnSort = document.getElementById('btn-sort');
    btnSort.addEventListener('click', () => {
      if (sortState === 'none') {
        sortState = 'asc';
        btnSort.className = 'btn asc';
      } else if (sortState === 'desc') {
        sortState = 'desc';
        btnSort.className = 'btn desc';
      } else {
        sortState = 'none';
        btnSort.className = 'btn';
      }
      applyView();
    });

    // 見出しのClassクリックでもソート可能
    document.getElementById('th-pos').addEventListener('click', () => {
      btnSort.click();
    });

    document.getElementById('filter').addEventListener('input', applyView);

    init();
  </script>
</body>
</html>
