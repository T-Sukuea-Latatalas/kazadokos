<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAZADOK</title>
  <style>
    @font-face {
      font-family: 'NotoSansKazadok';
      src: url('./Noto_Sans_Kazadok.otf') format('opentype');
      font-display: swap;
    }

    :root {
      --bg: #ffffff;
      --text: #000000;
      --border: #000000;
      --line: #e5e5e5;
      --sub: #888888;
      --sticky-offset: 72px;

      /* グリッド列幅: 未展開時(4列) と 展開時(5列) */
      --cols-collapsed: 26% 14% 22% 38% 0fr;
      --cols-expanded:  20% 12% 18% 25% 25%;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding: 40px;
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 30px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    h1 {
      font-size: 1.1rem;
      letter-spacing: 0.25em;
      font-weight: 700;
      text-transform: uppercase;
    }

    .count {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      color: var(--sub);
      text-transform: uppercase;
    }

    /* 画面上部固定バー */
    .sticky-bar {
      position: sticky;
      top: 0;
      background-color: var(--bg);
      z-index: 100;
      padding-top: 10px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .search-box {
      flex: 1;
    }

    .search-box input {
      width: 100%;
      background: transparent;
      border: none;
      padding: 8px 0;
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
      letter-spacing: 0.05em;
    }

    .search-box input::placeholder {
      color: var(--sub);
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    /* 統合されたOPEN/CLOSEトグルボタン */
    .btn-toggle {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      padding: 8px 16px;
      cursor: pointer;
      font-weight: 600;
      outline: none;
      transition: background-color 0.15s, color 0.15s;
      white-space: nowrap;
      text-transform: uppercase;
      min-width: 95px;
      text-align: center;
    }

    .btn-toggle:hover {
      background: var(--text);
      color: var(--bg);
    }

    /* 辞書一覧コンテナ */
    .dict-container {
      width: 100%;
      border-top: 1px solid var(--border);
    }

    /* 見出し行（ヘッダー） */
    .dict-header {
      display: grid;
      grid-template-columns: var(--cols-collapsed);
      border-bottom: 1px solid var(--border);
      transition: grid-template-columns 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
    }

    .dict-container.has-expanded .dict-header {
      grid-template-columns: var(--cols-expanded);
    }

    .th-cell {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 600;
      padding: 12px 14px;
      color: var(--sub);
      overflow: hidden;
      white-space: nowrap;
    }

    .th-cell.sortable {
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .th-cell.sortable:hover {
      color: var(--text);
    }

    .th-cell.sortable.asc::after {
      content: ' ↑';
      color: var(--text);
    }

    .th-cell.sortable.desc::after {
      content: ' ↓';
      color: var(--text);
    }

    /* 単語カード（枠全体） */
    .word-card {
      display: grid;
      grid-template-columns: var(--cols-collapsed);
      border-bottom: 1px solid var(--line); /* 枠同士を完全に1本線で区切る */
      cursor: pointer;
      transition: grid-template-columns 0.28s cubic-bezier(0.16, 1, 0.3, 1),
                  background-color 0.15s ease;
      background-color: var(--bg);
    }

    .word-card:hover {
      background-color: #fafafa;
    }

    .word-card.expanded {
      grid-template-columns: var(--cols-expanded);
      background-color: #f7f7f7;
    }

    /* 各セルの基本スタイル */
    .cell {
      padding: 16px 14px;
      font-size: 0.95rem;
    }

    /* [単語]（Boli）: 枠内で完全上下中央揃え */
    .cell-word {
      font-family: 'NotoSansKazadok', sans-serif;
      font-size: 1.4rem;
      letter-spacing: 0.05em;
      white-space: nowrap;
      align-self: center; /* 縦方向中央 */
    }

    /* [発音]（Pronunciation）: 枠内で完全上下中央揃え */
    .cell-pron {
      font-family: "Lucida Console", Monaco, monospace;
      font-size: 0.85rem;
      letter-spacing: 0.02em;
      line-height: 1.6;
      align-self: center; /* 縦方向中央 */
    }

    /* [品詞]（Class） */
    .cell-pos {
      line-height: 1.6;
      align-self: start;
    }

    /* 品詞スクロール追従（Sticky） */
    .sticky-pos {
      position: sticky;
      top: var(--sticky-offset);
      display: inline-block;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
    }

    /* [意味]（Meaning） */
    .cell-mean {
      white-space: pre-wrap;
      line-height: 1.6;
      align-self: start;
    }

    /* [ニュアンス]（Detail / Nuance） */
    .cell-detail {
      white-space: pre-wrap;
      line-height: 1.6;
      align-self: start;
      overflow: hidden;
      opacity: 0;
      transform: translateX(-10px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      font-size: 0.9rem;
      color: var(--text);
    }

    .word-card.expanded .cell-detail {
      opacity: 1;
      transform: translateX(0);
    }

    .detail-empty {
      color: var(--sub);
      font-style: italic;
    }

    /* 異なる品詞同士の境界線（枠内の横線区切り） */
    .pos-divider {
      border-top: 1px solid var(--line);
    }

    .state {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 40px 0;
      color: var(--sub);
    }

    @media (max-width: 768px) {
      :root {
        --sticky-offset: 108px;
        --cols-collapsed: 28% 16% 22% 34% 0fr;
        --cols-expanded:  20% 14% 18% 24% 24%;
      }
      body {
        padding: 30px 16px;
      }
      .sticky-bar {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
        padding-bottom: 14px;
      }
      .cell, .th-cell {
        padding: 12px 8px;
      }
      .cell-word {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Kazadok</h1>
    <span id="count" class="count"></span>
  </header>

  <!-- 画面上部固定バー: 検索バー + 統合トグルボタン -->
  <div class="sticky-bar">
    <div class="search-box">
      <input type="text" id="filter" placeholder="Search" autocomplete="off">
    </div>
    <button type="button" id="btn-toggle-all" class="btn-toggle">Open All</button>
  </div>

  <div id="state" class="state">Loading</div>

  <div id="dict-container" class="dict-container" style="display: none;">
    <!-- 見出し行 -->
    <div class="dict-header">
      <div class="th-cell">Boli</div>
      <div class="th-cell sortable" id="th-pos">Class</div>
      <div class="th-cell">Pronunciation</div>
      <div class="th-cell">Meaning</div>
      <div class="th-cell">Detail</div>
    </div>
    <!-- 単語リスト出力先 -->
    <div id="dict-body"></div>
  </div>

  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRThahRna9pyj-I9FmmH9sF8jye4uDOuGSK63Ti3KYI9NDcFds8hiASgM8ach7ybrlWjlr8H217wZwC/pub?gid=808368291&single=true&output=csv';

    function convertKazadok(str) {
      if (!str) return '';
      return str
        .replace(/\^/g, '\u0304')
        .replace(/´/g, '');
    }

    function restorePhonemes(str) {
      if (!str) return '';
      return str
        .replace(/q/g, 'ts')
        .replace(/Q/g, 'TS')
        .replace(/r/g, 'sh')
        .replace(/R/g, 'SH')
        .replace(/v/g, 'ly')
        .replace(/V/g, 'LY')
        .replace(/´/g, '');
    }

    function normalizeQuery(str) {
      if (!str) return '';
      return str.toLowerCase()
        .replace(/-/g, '^')
        .replace(/\u0304/g, '^')
        .replace(/´/g, '');
    }

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let val = '';
      let quote = false;

      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const next = text[i + 1];

        if (c === '"' && quote && next === '"') {
          val += '"';
          i++;
        } else if (c === '"') {
          quote = !quote;
        } else if (c === ',' && !quote) {
          row.push(val.trim());
          val = '';
        } else if ((c === '\r' || c === '\n') && !quote) {
          if (c === '\r' && next === '\n') i++;
          row.push(val.trim());
          if (row.some(item => item !== '')) rows.push(row);
          row = [];
          val = '';
        } else {
          val += c;
        }
      }
      if (val || row.length > 0) {
        row.push(val.trim());
        if (row.some(item => item !== '')) rows.push(row);
      }
      return rows;
    }

    async function fetchCSVWithFallback(url) {
      const target = url + (url.includes('?') ? '&' : '?') + '_ts=' + Date.now();
      
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 4000);
        const res = await fetch(target, { signal: controller.signal });
        clearTimeout(timeoutId);
        if (res.ok) {
          return await res.text();
        }
      } catch (err) {
        console.warn('Direct fetch blocked by CORS or timed out. Trying proxy fallback...');
      }

      const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(target);
      const proxyRes = await fetch(proxyUrl);
      if (!proxyRes.ok) throw new Error('Proxy fetch failed');
      return await proxyRes.text();
    }

    let records = [];
    let sortState = 'none';
    let isAllExpanded = false; // 一括開閉の状態

    async function init() {
      const stateEl = document.getElementById('state');
      const dictContainer = document.getElementById('dict-container');

      try {
        const csvText = await fetchCSVWithFallback(CSV_URL);
        const rows = parseCSV(csvText);

        const dataRows = (rows.length > 0 && (rows[0][0] === '単語' || rows[0][1] === '品詞' || rows[0][0] === 'Boli'))
          ? rows.slice(1)
          : rows;

        const groupedMap = new Map();

        dataRows.forEach(r => {
          const raw = (r[0] || '').trim();
          if (!raw) return;

          const sense = {
            pos: (r[1] || '').trim(),
            pron: (r[2] || '').trim(),
            mean: (r[3] || '').trim(),
            detail: (r[5] || '').trim()
          };

          if (!groupedMap.has(raw)) {
            groupedMap.set(raw, {
              id: groupedMap.size,
              raw: raw,
              word: convertKazadok(raw),
              restoredWord: normalizeQuery(restorePhonemes(raw)),
              senses: [sense]
            });
          } else {
            groupedMap.get(raw).senses.push(sense);
          }
        });

        groupedMap.forEach(item => {
          // 代表発音（最初に見つかった非空の発音）
          const fallbackPron = item.senses.find(s => s.pron)?.pron || '';
          item.mainPron = fallbackPron;

          // 2つ目以降で発音が空なら自動補完
          item.senses.forEach(s => {
            if (!s.pron) s.pron = fallbackPron;
          });

          // 同じ品詞をまとめてグループ化
          const posMap = new Map();
          item.senses.forEach(s => {
            const posKey = s.pos || '—';
            if (!posMap.has(posKey)) {
              posMap.set(posKey, []);
            }
            posMap.get(posKey).push(s);
          });

          item.posGroups = Array.from(posMap.entries()).map(([pos, senses]) => ({
            pos: pos === '—' ? '' : pos,
            senses: senses
          }));
        });

        records = Array.from(groupedMap.values());

        applyView();
        stateEl.style.display = 'none';
        dictContainer.style.display = 'block';
      } catch (e) {
        console.error(e);
        stateEl.textContent = 'Error: Failed to load data.';
      }
    }

    function applyView() {
      const rawInput = document.getElementById('filter').value.trim();
      const qNorm = normalizeQuery(rawInput);
      const qLower = rawInput.toLowerCase();

      let list = !rawInput ? [...records] : records.filter(item => {
        if (item.restoredWord.includes(qNorm)) return true;
        return item.senses.some(s =>
          s.pos.toLowerCase().includes(qLower) ||
          s.pron.toLowerCase().includes(qLower) ||
          s.mean.toLowerCase().includes(qLower) ||
          s.detail.toLowerCase().includes(qLower)
        );
      });

      if (sortState === 'asc') {
        list.sort((a, b) => {
          const posA = a.posGroups[0]?.pos || '';
          const posB = b.posGroups[0]?.pos || '';
          return posA.localeCompare(posB, 'ja') || a.id - b.id;
        });
      } else if (sortState === 'desc') {
        list.sort((a, b) => {
          const posA = a.posGroups[0]?.pos || '';
          const posB = b.posGroups[0]?.pos || '';
          return posB.localeCompare(posA, 'ja') || a.id - b.id;
        });
      } else {
        list.sort((a, b) => a.id - b.id);
      }

      render(list);
    }

    function render(list) {
      const dictBody = document.getElementById('dict-body');
      const dictContainer = document.getElementById('dict-container');
      const countEl = document.getElementById('count');
      dictBody.innerHTML = '';
      countEl.textContent = `${list.length} BOLI`;

      const frag = document.createDocumentFragment();

      list.forEach(item => {
        const totalGroups = item.posGroups.length;

        // 単語カードコンテナ（外枠）
        const card = document.createElement('div');
        card.className = `word-card ${isAllExpanded ? 'expanded' : ''}`;
        card.dataset.wordId = item.id;

        // 1. [単語]（Boli）: 枠全体で上下中央揃え
        const cellWord = document.createElement('div');
        cellWord.className = 'cell cell-word';
        cellWord.textContent = item.word;
        cellWord.title = item.raw;
        cellWord.style.gridColumn = '1';
        cellWord.style.gridRow = `1 / span ${totalGroups}`;
        card.appendChild(cellWord);

        // 2. [発音]（Pronunciation）: 枠全体で上下中央揃え
        const cellPron = document.createElement('div');
        cellPron.className = 'cell cell-pron';
        cellPron.textContent = item.mainPron;
        cellPron.style.gridColumn = '3';
        cellPron.style.gridRow = `1 / span ${totalGroups}`;
        card.appendChild(cellPron);

        // 各品詞行（Class, Meaning, Detail）を配置
        item.posGroups.forEach((group, gIndex) => {
          const rowNum = gIndex + 1;
          const isDivider = gIndex > 0;

          // 品詞セル
          const cellPos = document.createElement('div');
          cellPos.className = `cell cell-pos ${isDivider ? 'pos-divider' : ''}`;
          cellPos.style.gridColumn = '2';
          cellPos.style.gridRow = `${rowNum}`;

          const stickyPos = document.createElement('span');
          stickyPos.className = 'sticky-pos';
          stickyPos.textContent = group.pos;
          cellPos.appendChild(stickyPos);
          card.appendChild(cellPos);

          // 意味セル
          const cellMean = document.createElement('div');
          cellMean.className = `cell cell-mean ${isDivider ? 'pos-divider' : ''}`;
          cellMean.style.gridColumn = '4';
          cellMean.style.gridRow = `${rowNum}`;
          if (group.senses.length === 1) {
            cellMean.textContent = group.senses[0].mean;
          } else {
            cellMean.textContent = group.senses
              .map((s, idx) => `${idx + 1}. ${s.mean}`)
              .join('\n');
          }
          card.appendChild(cellMean);

          // ニュアンスセル
          const cellDetail = document.createElement('div');
          cellDetail.className = `cell cell-detail ${isDivider ? 'pos-divider' : ''}`;
          cellDetail.style.gridColumn = '5';
          cellDetail.style.gridRow = `${rowNum}`;

          if (group.senses.length === 1) {
            const detailText = group.senses[0].detail.trim();
            cellDetail.textContent = detailText || '-';
            if (!detailText) cellDetail.className += ' detail-empty';
          } else {
            cellDetail.textContent = group.senses
              .map((s, idx) => `${idx + 1}. ${s.detail.trim() || '-'}`)
              .join('\n');
          }
          card.appendChild(cellDetail);
        });

        // 単語枠のタップによる個別開閉
        card.addEventListener('click', () => {
          card.classList.toggle('expanded');
          updateHeaderWidth();
        });

        frag.appendChild(card);
      });

      dictBody.appendChild(frag);
      updateHeaderWidth();
    }

    // ヘッダーの列幅状態とボタン表示の同期
    function updateHeaderWidth() {
      const dictContainer = document.getElementById('dict-container');
      const btnToggle = document.getElementById('btn-toggle-all');
      const cards = document.querySelectorAll('.word-card');
      const expandedCards = document.querySelectorAll('.word-card.expanded');

      const anyExpanded = expandedCards.length > 0;
      dictContainer.classList.toggle('has-expanded', anyExpanded);

      // すべて開いているかどうかでボタン表示を変更
      if (cards.length > 0 && expandedCards.length === cards.length) {
        isAllExpanded = true;
        btnToggle.textContent = 'Close All';
      } else {
        isAllExpanded = false;
        btnToggle.textContent = 'Open All';
      }
    }

    // OPEN ALL / CLOSE ALL 統合トグルボタン
    document.getElementById('btn-toggle-all').addEventListener('click', () => {
      isAllExpanded = !isAllExpanded;
      const cards = document.querySelectorAll('.word-card');
      cards.forEach(card => card.classList.toggle('expanded', isAllExpanded));
      updateHeaderWidth();
    });

    // 品詞ソート
    const thPos = document.getElementById('th-pos');
    thPos.addEventListener('click', () => {
      if (sortState === 'none') {
        sortState = 'asc';
        thPos.className = 'th-cell sortable asc';
      } else if (sortState === 'asc') {
        sortState = 'desc';
        thPos.className = 'th-cell sortable desc';
      } else {
        sortState = 'none';
        thPos.className = 'th-cell sortable';
      }
      applyView();
    });

    document.getElementById('filter').addEventListener('input', applyView);

    init();
  </script>
</body>
</html>
