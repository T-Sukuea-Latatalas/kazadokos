<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAZADOK</title>
  <style>
    @font-face {
      font-family: 'NotoSansKazadok';
      src: url('./Noto_Sans_Kazadok.otf') format('opentype');
      font-display: swap;
    }

    :root {
      --bg: #ffffff;
      --text: #000000;
      --border: #000000;
      --muted: #666666;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Yu Gothic", sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      padding: 80px 40px;
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 60px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    h1 {
      font-size: 1.2rem;
      letter-spacing: 0.2em;
      font-weight: 700;
      text-transform: uppercase;
    }

    .search-box {
      margin-bottom: 40px;
    }

    .search-box input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      padding: 10px 0;
      font-size: 1rem;
      color: var(--text);
      outline: none;
      border-radius: 0;
      letter-spacing: 0.05em;
    }

    .search-box input::placeholder {
      color: var(--muted);
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 600;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
    }

    td {
      padding: 16px;
      border-bottom: 1px solid #e0e0e0;
      vertical-align: baseline;
      font-size: 0.95rem;
    }

    tbody tr:hover {
      background-color: #f7f7f7;
    }

    /* 独自文字フォント適用列 */
    .col-word {
      font-family: 'NotoSansKazadok', sans-serif;
      font-size: 1.35rem;
      letter-spacing: 0.05em;
      white-space: nowrap;
      width: 25%;
    }

    .col-pos {
      width: 15%;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
    }

    .col-pron {
      width: 25%;
      font-family: "Lucida Console", Monaco, monospace;
      font-size: 0.85rem;
    }

    .col-mean {
      width: 35%;
    }

    .status {
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 40px 0;
      color: var(--muted);
    }

    @media (max-width: 768px) {
      body {
        padding: 40px 20px;
      }
      th, td {
        padding: 12px 8px;
      }
      .col-word {
        font-size: 1.15rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Kazadok</h1>
    <span id="count" style="font-size: 0.75rem; letter-spacing: 0.1em; color: var(--muted);"></span>
  </header>

  <div class="search-box">
    <input type="text" id="search-input" placeholder="Search..." autocomplete="off">
  </div>

  <div id="status" class="status">Loading...</div>

  <table id="dictionary-table" style="display: none;">
    <thead>
      <tr>
        <th class="col-word">Word</th>
        <th class="col-pos">Class</th>
        <th class="col-pron">Pronunciation</th>
        <th class="col-mean">Meaning</th>
      </tr>
    </thead>
    <tbody id="dictionary-body"></tbody>
  </table>

  <script>
    // ==========================================
    // 設定: スプレッドシートの情報
    // ==========================================
    // スプレッドシートURLの「/d/」と「/edit」の間にある文字列を入力してください
    const SPREADSHEET_ID = 'ここにスプレッドシートのIDを入力'; 
    const SHEET_NAME = '単語';

    // A列テキストの置換関数
    function transformKazadokWord(rawText) {
      if (!rawText) return '';
      return rawText
        // ly -> v
        .replace(/ly/gi, (m) => m === 'LY' || m === 'Ly' ? 'V' : 'v')
        // ts -> q
        .replace(/ts/gi, (m) => m === 'TS' || m === 'Ts' ? 'Q' : 'q')
        // sh -> r
        .replace(/sh/gi, (m) => m === 'SH' || m === 'Sh' ? 'R' : 'r')
        // ^ -> ̄ (結合マクロン)
        .replace(/\^/g, '\u0304')
        // ´ を消す
        .replace(/´/g, '');
    }

    // CSVパーサー（改行やダブルクォートに対応）
    function parseCSV(text) {
      const rows = [];
      let currentRow = [];
      let currentVal = '';
      let insideQuote = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"' && insideQuote && nextChar === '"') {
          currentVal += '"';
          i++;
        } else if (char === '"') {
          insideQuote = !insideQuote;
        } else if (char === ',' && !insideQuote) {
          currentRow.push(currentVal.trim());
          currentVal = '';
        } else if ((char === '\r' || char === '\n') && !insideQuote) {
          if (char === '\r' && nextChar === '\n') i++;
          currentRow.push(currentVal.trim());
          if (currentRow.some(val => val !== '')) {
            rows.push(currentRow);
          }
          currentRow = [];
          currentVal = '';
        } else {
          currentVal += char;
        }
      }
      if (currentVal || currentRow.length > 0) {
        currentRow.push(currentVal.trim());
        if (currentRow.some(val => val !== '')) {
          rows.push(currentRow);
        }
      }
      return rows;
    }

    let wordDataList = [];

    async function loadData() {
      const statusEl = document.getElementById('status');
      const tableEl = document.getElementById('dictionary-table');

      // キャッシュを防ぐためタイムスタンプを付与
      const queryUrl = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}&_=${Date.now()}`;

      try {
        const response = await fetch(queryUrl);
        if (!response.ok) throw new Error('Data fetch failed');
        
        const csvText = await response.text();
        const rows = parseCSV(csvText);

        // データ行（ヘッダーがある場合は2行目以降）を抽出
        // 1行目が「単語」などのヘッダーなら切り捨て
        const dataRows = (rows.length > 0 && (rows[0][0] === '単語' || rows[0][1] === '品詞')) 
          ? rows.slice(1) 
          : rows;

        wordDataList = dataRows.map(row => {
          const rawWord = row[0] || '';
          return {
            rawWord: rawWord,
            convertedWord: transformKazadokWord(rawWord),
            pos: row[1] || '',
            pron: row[2] || '',
            meaning: row[3] || ''
          };
        }).filter(item => item.rawWord !== '');

        renderTable(wordDataList);
        statusEl.style.display = 'none';
        tableEl.style.display = 'table';
      } catch (err) {
        statusEl.textContent = 'Failed to load data.';
      }
    }

    function renderTable(list) {
      const tbody = document.getElementById('dictionary-body');
      const countEl = document.getElementById('count');
      tbody.innerHTML = '';
      countEl.textContent = `${list.length} WORDS`;

      const fragment = document.createDocumentFragment();
      list.forEach(item => {
        const tr = document.createElement('tr');
        
        const tdWord = document.createElement('td');
        tdWord.className = 'col-word';
        tdWord.textContent = item.convertedWord;
        // ツールチップで変換前のアルファベットも確認可能
        tdWord.title = item.rawWord;

        const tdPos = document.createElement('td');
        tdPos.className = 'col-pos';
        tdPos.textContent = item.pos;

        const tdPron = document.createElement('td');
        tdPron.className = 'col-pron';
        tdPron.textContent = item.pron;

        const tdMean = document.createElement('td');
        tdMean.className = 'col-mean';
        tdMean.textContent = item.meaning;

        tr.appendChild(tdWord);
        tr.appendChild(tdPos);
        tr.appendChild(tdPron);
        tr.appendChild(tdMean);
        fragment.appendChild(tr);
      });
      tbody.appendChild(fragment);
    }

    // 検索入力によるリアルタイム絞り込み
    document.getElementById('search-input').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) {
        renderTable(wordDataList);
        return;
      }
      const filtered = wordDataList.filter(item => 
        item.rawWord.toLowerCase().includes(q) ||
        item.convertedWord.toLowerCase().includes(q) ||
        item.pos.toLowerCase().includes(q) ||
        item.pron.toLowerCase().includes(q) ||
        item.meaning.toLowerCase().includes(q)
      );
      renderTable(filtered);
    });

    loadData();
  </script>
</body>
</html>
