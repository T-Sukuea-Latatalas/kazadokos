<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAZADOK</title>
  <style>
    @font-face {
      font-family: 'NotoSansKazadok';
      src: url('./Noto_Sans_Kazadok.otf') format('opentype');
      font-display: swap;
    }

    :root {
      --bg: #ffffff;
      --text: #000000;
      --border: #000000;
      --line: #e5e5e5;
      --sub: #888888;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding: 60px 40px;
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 50px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    h1 {
      font-size: 1.1rem;
      letter-spacing: 0.25em;
      font-weight: 700;
      text-transform: uppercase;
    }

    .count {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      color: var(--sub);
    }

    .search {
      margin-bottom: 40px;
    }

    .search input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      padding: 12px 0;
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
      border-radius: 0;
      letter-spacing: 0.05em;
    }

    .search input::placeholder {
      color: var(--sub);
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 600;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--sub);
    }

    td {
      padding: 16px 14px;
      border-bottom: 1px solid var(--line);
      vertical-align: baseline;
      font-size: 0.95rem;
    }

    tbody tr:hover {
      background-color: #f9f9f9;
    }

    /* 独自フォント列 */
    .col-word {
      font-family: 'NotoSansKazadok', sans-serif;
      font-size: 1.4rem;
      letter-spacing: 0.05em;
      white-space: nowrap;
      width: 28%;
    }

    .col-pos {
      width: 14%;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
    }

    .col-pron {
      width: 24%;
      font-family: "Lucida Console", Monaco, monospace;
      font-size: 0.85rem;
      letter-spacing: 0.02em;
    }

    .col-mean {
      width: 34%;
    }

    .state {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 40px 0;
      color: var(--sub);
    }

    @media (max-width: 768px) {
      body {
        padding: 40px 16px;
      }
      th, td {
        padding: 12px 8px;
      }
      .col-word {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Kazadok</h1>
    <span id="count" class="count"></span>
  </header>

  <div class="search">
    <input type="text" id="filter" placeholder="Search" autocomplete="off">
  </div>

  <div id="state" class="state">Loading</div>

  <table id="table" style="display: none;">
    <thead>
      <tr>
        <th class="col-word">Word</th>
        <th class="col-pos">Class</th>
        <th class="col-pron">Pronunciation</th>
        <th class="col-mean">Meaning</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <script>
    // ==============================================================
    // 設定: 「ウェブに公開」で取得したCSVのURLをここに貼り付けてください
    // ==============================================================
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRThahRna9pyj-I9FmmH9sF8jye4uDOuGSK63Ti3KYI9NDcFds8hiASgM8ach7ybrlWjlr8H217wZwC/pub?gid=808368291&single=true&output=csv';

    // A列用 文字置換処理
    function convertKazadok(str) {
      if (!str) return '';
      return str
        .replace(/ly/gi, (m) => m === 'LY' || m === 'Ly' ? 'V' : 'v') // ly -> v
        .replace(/ts/gi, (m) => m === 'TS' || m === 'Ts' ? 'Q' : 'q') // ts -> q
        .replace(/sh/gi, (m) => m === 'SH' || m === 'Sh' ? 'R' : 'r') // sh -> r
        .replace(/\^/g, '\u0304')                                     // ^ -> ̄ (マクロン)
        .replace(/´/g, '');                                           // ´ -> 消す
    }

    // CSV解析パーサー（改行・ダブルクォート対応）
    function parseCSV(text) {
      const rows = [];
      let row = [];
      let val = '';
      let quote = false;

      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const next = text[i + 1];

        if (c === '"' && quote && next === '"') {
          val += '"';
          i++;
        } else if (c === '"') {
          quote = !quote;
        } else if (c === ',' && !quote) {
          row.push(val.trim());
          val = '';
        } else if ((c === '\r' || c === '\n') && !quote) {
          if (c === '\r' && next === '\n') i++;
          row.push(val.trim());
          if (row.some(item => item !== '')) rows.push(row);
          row = [];
          val = '';
        } else {
          val += c;
        }
      }
      if (val || row.length > 0) {
        row.push(val.trim());
        if (row.some(item => item !== '')) rows.push(row);
      }
      return rows;
    }

    let records = [];

    async function init() {
      const stateEl = document.getElementById('state');
      const tableEl = document.getElementById('table');

      try {
        // キャッシュを防ぐためタイムスタンプパラメータを付与
        const fetchUrl = CSV_URL + (CSV_URL.includes('?') ? '&' : '?') + '_ts=' + Date.now();
        const res = await fetch(fetchUrl);
        if (!res.ok) throw new Error();

        const csvText = await res.text();
        const rows = parseCSV(csvText);

        // 1行目がヘッダー（単語/品詞等）の場合はスキップ
        const dataRows = (rows.length > 0 && (rows[0][0] === '単語' || rows[0][1] === '品詞'))
          ? rows.slice(1)
          : rows;

        records = dataRows.map(r => {
          const raw = r[0] || '';
          return {
            raw: raw,
            word: convertKazadok(raw),
            pos: r[1] || '',
            pron: r[2] || '',
            mean: r[3] || ''
          };
        }).filter(item => item.raw !== '');

        render(records);
        stateEl.style.display = 'none';
        tableEl.style.display = 'table';
      } catch (e) {
        stateEl.textContent = 'Error';
      }
    }

    function render(list) {
      const tbody = document.getElementById('tbody');
      const countEl = document.getElementById('count');
      tbody.innerHTML = '';
      countEl.textContent = `${list.length}`;

      const frag = document.createDocumentFragment();
      list.forEach(item => {
        const tr = document.createElement('tr');

        const tdWord = document.createElement('td');
        tdWord.className = 'col-word';
        tdWord.textContent = item.word;
        tdWord.title = item.raw;

        const tdPos = document.createElement('td');
        tdPos.className = 'col-pos';
        tdPos.textContent = item.pos;

        const tdPron = document.createElement('td');
        tdPron.className = 'col-pron';
        tdPron.textContent = item.pron;

        const tdMean = document.createElement('td');
        tdMean.className = 'col-mean';
        tdMean.textContent = item.mean;

        tr.appendChild(tdWord);
        tr.appendChild(tdPos);
        tr.appendChild(tdPron);
        tr.appendChild(tdMean);
        frag.appendChild(tr);
      });
      tbody.appendChild(frag);
    }

    // インクリメンタル検索（単語、発音、品詞、意味で照合）
    document.getElementById('filter').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) {
        render(records);
        return;
      }
      const filtered = records.filter(item =>
        item.raw.toLowerCase().includes(q) ||
        item.word.toLowerCase().includes(q) ||
        item.pos.toLowerCase().includes(q) ||
        item.pron.toLowerCase().includes(q) ||
        item.mean.toLowerCase().includes(q)
      );
      render(filtered);
    });

    init();
  </script>
</body>
</html>
